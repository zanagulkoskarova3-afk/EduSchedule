<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Schedule KZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   style.css — Ақылды кесте
   ========================================================= */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --accent: #0e7490;
  --accent-2: #f5b301;
  --accent-soft: #e0f2f7;
  --ok: #15803d;
  --ok-soft: #dcfce7;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px; color: var(--text); background: var(--bg); line-height: 1.45;
}

/* ---------- Жоғарғы панель ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 24px; background: linear-gradient(120deg, #0b5566, #0e7490 60%, #1595a8);
  color: #fff;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
  background: var(--accent-2); color: #0b3a45; font-size: 22px; font-weight: 700;
}
.brand-title { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
.brand-sub { font-size: 12px; opacity: .8; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.lang-switch { display: flex; background: rgba(255, 255, 255, .15); border-radius: 8px; padding: 3px; }
.lang-switch button {
  border: 0; background: transparent; color: #fff; padding: 6px 12px; border-radius: 6px;
  font-weight: 600; cursor: pointer; font-family: inherit;
}
.lang-switch button.active { background: #fff; color: var(--accent); }
.topbar .btn.ghost { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .25); }

/* ---------- Табтар ---------- */
.tabs {
  display: flex; gap: 4px; padding: 0 24px; background: var(--surface);
  border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 0; z-index: 5;
}
.tabs button {
  border: 0; background: none; padding: 14px 14px; font: inherit; font-weight: 500;
  color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap;
}
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

main { padding: 20px 24px 48px; max-width: 1500px; margin: 0 auto; }
.tab { display: none; }
.tab.active { display: block; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- Карточкалар ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow);
}
.card h2 { font-size: 16px; margin: 0 0 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.card-head h2 { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; }
.grid2 .card { margin-bottom: 0; }
.grid2 + .card { margin-top: 18px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.empty { color: var(--muted); text-align: center; padding: 28px; }
.badge { background: var(--accent-soft); color: var(--accent); padding: 2px 10px; border-radius: 99px; font-weight: 600; }
.scroll { overflow-x: auto; }

/* ---------- Формалар ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-weight: 500; }
.field > span { font-size: 13px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; margin: 0; }
input, select, textarea {
  font: inherit; color: inherit; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; font-family: ui-monospace, monospace; font-size: 13px; }
input.num { width: 70px; text-align: center; }
.teacher-form { display: grid; grid-template-columns: 1fr 160px 180px; gap: 12px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 600;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
  color: var(--text); cursor: pointer; transition: background .15s, transform .05s;
}
.btn:hover { background: #f8fafc; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #0b6175; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn-row.end { justify-content: flex-end; margin-top: 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.spacer { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px;
  font: inherit; font-size: 13px; cursor: pointer; border-left: 4px solid var(--c);
}
.chip.on { background: var(--c); color: #fff; border-color: var(--c); font-weight: 600; }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; margin: 1px 0;
  background: color-mix(in srgb, var(--c) 14%, white); color: color-mix(in srgb, var(--c) 70%, black);
}
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

/* ---------- Кестелер ---------- */
.tbl { border-collapse: collapse; width: 100%; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; background: #f8fafc; }
.tbl.plan td, .tbl.plan th { text-align: center; }
.tbl.plan td.subj { text-align: left; white-space: nowrap; }
.tbl.plan small { display: block; color: var(--muted); font-size: 11px; }
.tbl tr.total td { font-weight: 700; background: #f8fafc; }
.tbl tr.muted td { color: var(--muted); }
td.bad { color: var(--bad); font-weight: 700; }
.nowrap { white-space: nowrap; }
.tbl.assign td { padding: 4px; text-align: center; }
.tbl.assign td.na { background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 4px, #f1f5f9 4px, #f1f5f9 8px); }
.tbl.assign th.vert { vertical-align: bottom; padding: 6px 2px; }
.tbl.assign th.vert span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; text-transform: none; }
.as-sel { font-size: 12px; padding: 4px; max-width: 130px; display: block; margin: 2px auto; }
.as-sel.empty { border-color: var(--bad); background: var(--bad-soft); }
.barcell { width: 160px; }
.mini-bar { height: 8px; background: #eef2f7; border-radius: 99px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.mini-bar.over i { background: var(--bad); }

/* Сабақ кестесі */
.tt { border-collapse: separate; border-spacing: 4px; width: 100%; }
.tt th { font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px; }
.tt td.pn { font-weight: 700; color: var(--muted); text-align: center; width: 32px; }
.tt td.bell { font-size: 11px; color: var(--muted); white-space: nowrap; width: 90px; }
.tt td.cell {
  background: color-mix(in srgb, var(--c) 12%, white); border-left: 4px solid var(--c);
  border-radius: 8px; padding: 6px 8px; min-width: 120px; height: 52px; cursor: pointer;
  transition: transform .08s, box-shadow .15s;
}
.tt td.cell:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
.tt td.cell.free { background: #f8fafc; border-left: 4px dashed var(--line); }
.tt td.cell.selected { outline: 3px solid var(--accent-2); transform: scale(1.02); }
.tt td.cell.conflict { background: var(--bad-soft); border-left-color: var(--bad); }
.tt .s { font-weight: 600; font-size: 13px; }
.tt .tch { font-size: 11px; color: var(--muted); }
.tt.all td.cell { min-width: 100px; height: 44px; padding: 4px 6px; }
.tt.all .s { font-size: 12px; }
.tt.all tr.day-start td { border-top: 0; }
.tt.all tr.day-start > td { box-shadow: inset 0 3px 0 -1px transparent; }
.tt td.dayname { background: var(--accent); color: #fff; border-radius: 8px; width: 32px; text-align: center; font-weight: 700; }
.tt td.dayname span { writing-mode: vertical-rl; transform: rotate(180deg); }

.tbl.ktp td[contenteditable] { min-width: 120px; cursor: text; }
.tbl.ktp td[contenteditable]:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
.tbl.ktp td.pre { white-space: pre-line; }
.tbl.ktp small { color: var(--muted); }

/* ---------- Ескертулер ---------- */
.alert { padding: 10px 14px; border-radius: 8px; margin: 10px 0; background: var(--accent-soft); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }

.progress { position: relative; height: 26px; background: #eef2f7; border-radius: 8px; margin-top: 14px; overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #22a7bd); transition: width .2s; }
.progress span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; }

.spinner {
  display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent-soft);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- AI ---------- */
.ai-output { margin-top: 14px; max-height: 560px; overflow: auto; }
.ai-output h4 { margin: 14px 0 6px; color: var(--accent); }
.ai-output p, .msg p { margin: 6px 0; }
.chat-card { display: flex; flex-direction: column; }
.chat { flex: 1; min-height: 320px; max-height: 520px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: #f1f5f9; border-bottom-left-radius: 4px; }
.msg h4 { margin: 8px 0 4px; }
.msg ul, .ai-output ul { margin: 4px 0; padding-left: 20px; }
.chat-input { display: flex; gap: 8px; margin-top: 12px; }
.chat-input textarea { flex: 1; font-family: inherit; }

/* ---------- Диалог, тост ---------- */
dialog { border: 0; border-radius: var(--radius); padding: 0; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); width: min(480px, 92vw); }
dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dlg { padding: 22px; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
  background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 10px; transition: all .25s;
  pointer-events: none; z-index: 50; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--bad); }

/* ---------- Мобильді ---------- */
@media (max-width: 720px) {
  .topbar, .tabs, main { padding-left: 14px; padding-right: 14px; }
  .brand-sub { display: none; }
  .teacher-form { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}

/* ---------- Басып шығару ---------- */
.print-title { display: none; }
@media print {
  body { background: #fff; font-size: 11px; }
  .no-print, .tabs, .topbar, .toast, .hint, #schStatus, #ktpStatus { display: none !important; }
  main { padding: 0; max-width: none; }
  .card { box-shadow: none; border: 0; padding: 0; }
  .print-title { display: block; }
  .tt td.cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; height: auto; }
  .tbl.ktp td { border: 1px solid #999; }
  @page { size: A4 landscape; margin: 10mm; }
}


/* ---------- v2: аккаунттар және жаңартылған дизайн ---------- */
[hidden] { display: none !important; }
:root { --radius: 14px; }
body {
  background:
    radial-gradient(1100px 520px at 105% -10%, #d9f0f5 0, transparent 60%),
    radial-gradient(900px 480px at -10% 110%, #fdf1cf 0, transparent 55%),
    var(--bg);
  background-attachment: fixed; min-height: 100vh;
}
.topbar { box-shadow: 0 2px 12px rgba(11, 85, 102, .25); }
.topbar .btn.ghost:hover { background: rgba(255, 255, 255, .22); }
.tabs { gap: 6px; padding: 8px 24px; background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px); }
.tabs button { padding: 8px 14px; border-radius: 99px; border-bottom: 0; transition: background .15s, color .15s; }
.tabs button:hover { background: #f1f5f9; }
.tabs button.active { background: var(--accent); color: #fff; border-bottom: 0; box-shadow: 0 2px 8px rgba(14, 116, 144, .3); }
.card { transition: box-shadow .2s; }
.card:hover { box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .08); }
.card h2:not(.print-title) { display: flex; align-items: center; gap: 8px; }
.card h2:not(.print-title)::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--accent-2); flex: none; }
.muted { color: var(--muted); }
code { background: #f1f5f9; padding: 1px 6px; border-radius: 5px; font-size: 12px; }

/* Пайдаланушы чипі */
.user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border-radius: 99px; background: rgba(255, 255, 255, .14); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: var(--accent-2); color: #0b3a45; font-weight: 700; font-size: 13px;
}
.avatar.sm { width: 26px; height: 26px; font-size: 11px; vertical-align: middle; background: var(--accent-soft); color: var(--accent); }
.user-name { font-weight: 600; font-size: 13px; line-height: 1.2; }
.user-role { font-size: 11px; opacity: .8; }

/* Кіру беті */
body.locked .topbar, body.locked .tabs, body.locked main { display: none !important; }
.auth {
  min-height: 100vh; display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #0b5566 0%, #0e7490 55%, #1595a8 100%);
}
.auth::before, .auth::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
.auth::before { width: 520px; height: 520px; right: -160px; top: -180px; background: rgba(245, 179, 1, .18); }
.auth::after { width: 420px; height: 420px; left: -140px; bottom: -160px; background: rgba(255, 255, 255, .08); }
.auth-card {
  width: min(420px, 100%); background: #fff; border-radius: 20px; padding: 28px; position: relative; z-index: 1;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .28); animation: fade .3s ease;
}
.auth-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
.auth .brand-sub { color: var(--muted); opacity: 1; }
.auth .lang-switch { background: #f1f5f9; }
.auth .lang-switch button { color: var(--muted); }
.auth .lang-switch button.active { background: var(--accent); color: #fff; }
.auth h2 { margin: 0 0 4px; font-size: 20px; }
.auth-card .field input { padding: 10px 12px; }
.check { display: flex; gap: 8px; align-items: center; margin: 2px 0 14px; color: var(--muted); font-size: 13px; cursor: pointer; }
.btn.block { width: 100%; justify-content: center; padding: 11px; font-size: 15px; }
.auth-foot { margin: 16px 0 0; text-align: center; color: var(--muted); font-size: 12px; }

/* Пайдаланушылар беті */
.user-form { display: grid; grid-template-columns: 1.4fr 1fr 1fr 170px auto; gap: 12px; align-items: end; }
.user-form .field { margin: 0; }
.pass-row { display: flex; gap: 6px; }
.pass-row input { flex: 1; min-width: 0; }
.role-sel { padding: 4px 8px; font-size: 13px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.viewas {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 16px;
  border-radius: 10px; background: var(--warn-soft); color: var(--warn); border: 1px solid #fcd34d;
}

/* Excel импорт */
.excel-opts { display: flex; gap: 18px; flex-wrap: wrap; margin: 14px 0; }
.excel-opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.tag.unknown { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }

@media (max-width: 900px) {
  .user-form { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; }
  .top-actions { flex-wrap: wrap; }
  .user-chip > div { display: none; }
  .user-chip { padding: 4px; }
  .user-form { grid-template-columns: 1fr; }
}
@media print { .viewas, .auth { display: none !important; } }

/* Синхрондау белгісі */
.sync { border: 0; background: rgba(255, 255, 255, .12); color: #fff; font: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 12px; border-radius: 99px; cursor: default; white-space: nowrap; }
.sync.saving { background: rgba(245, 179, 1, .3); }
.sync.error { background: #fecaca; color: var(--bad); cursor: pointer; }
#authBoot { margin: 8px 0; }

</style>
</head>
<body class="locked">
  <!-- КІРУ -->
  <div id="authScreen" class="auth" hidden>
    <div class="auth-card">
      <div class="auth-top">
        <div class="brand">
          <span class="logo">▦</span>
          <div><div class="brand-title" data-i18n="appTitle"></div><div class="brand-sub" data-i18n="appSub"></div></div>
        </div>
        <div class="lang-switch"><button type="button" data-lang="kk">ҚАЗ</button><button type="button" data-lang="en">ENG</button></div>
      </div>
      <h2 id="authTitle"></h2>
      <p class="hint" id="authHint"></p>
      <form id="authForm" autocomplete="on">
        <label class="field" id="fName"><span data-i18n="fullName"></span><input id="aName" autocomplete="name"></label>
        <label class="field"><span data-i18n="login"></span><input id="aLogin" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
        <label class="field"><span data-i18n="password"></span><input id="aPass" type="password" autocomplete="current-password"></label>
        <label class="field" id="fPass2"><span data-i18n="password2"></span><input id="aPass2" type="password" autocomplete="new-password"></label>
        <label class="check"><input type="checkbox" id="aRemember" checked> <span data-i18n="remember"></span></label>
        <div id="authErr" class="alert bad" hidden></div>
        <button class="btn primary block" id="authSubmit" type="submit"></button>
      </form>
      <div id="authBoot" hidden></div>
      <p class="auth-foot" id="authFoot"></p>
    </div>
  </div>

  <header class="topbar no-print">
    <div class="brand">
      <span class="logo">▦</span>
      <div>
        <div class="brand-title" data-i18n="appTitle"></div>
        <div class="brand-sub" data-i18n="appSub"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="sync" id="syncStatus" type="button"></button>
      <div class="user-chip"><span class="avatar" id="userAvatar"></span>
        <div><div class="user-name" id="userName"></div><div class="user-role" id="userRole"></div></div></div>
      <button class="btn ghost" id="btnPassword" data-i18n-title="changePwd">🔑</button>
      <button class="btn ghost" id="btnSettings">⚙ <span data-i18n="settings"></span></button>
      <div class="lang-switch">
        <button data-lang="kk">ҚАЗ</button><button data-lang="en">ENG</button>
      </div>
      <button class="btn ghost" id="btnLogout">⎋ <span data-i18n="logout"></span></button>
    </div>
  </header>

  <nav class="tabs no-print" id="tabs">
    <button data-tab="school" class="active">1. <span data-i18n="tabSchool"></span></button>
    <button data-tab="teachers">2. <span data-i18n="tabTeachers"></span></button>
    <button data-tab="plan">3. <span data-i18n="tabPlan"></span></button>
    <button data-tab="load">4. <span data-i18n="tabLoad"></span></button>
    <button data-tab="schedule">5. <span data-i18n="tabSchedule"></span></button>
    <button data-tab="ktp">6. <span data-i18n="tabKtp"></span></button>
    <button data-tab="ai">✦ <span data-i18n="tabAi"></span></button>
    <button data-tab="users" id="tabUsersBtn" hidden>👥 <span data-i18n="tabUsers"></span></button>
  </nav>

  <main>
    <div id="viewAsBar" class="viewas" hidden></div>
    <!-- 1. МЕКТЕП -->

    ['Омаров Н.', ['physics']], ['Ахметова Ш.', ['chemistry', 'biology']],
    ['Сұлтанова Б.', ['biology', 'science']], ['Қайратова Ә.', ['geography', 'science']],
    ['Төлегенов С.', ['hist_kz', 'hist_world', 'law']], ['Әбілова Г.', ['hist_kz', 'hist_world']],
    ['Мусин Е.', ['music']], ['Байжанова К.', ['art']],
    ['Қуанышев А.', ['pe']], ['Ибраев М.', ['pe']], ['Жақсылықов Р.', ['nvtp', 'pe']]
  ].map(([name, subjects], i) => ({ id: 'demo' + i, name, subjects, maxHours: 24, offDay: -1 }));

  function hoursFor(value, quarter) {
    if (Array.isArray(value)) return Number(value[quarter] || 0);
    return Number(value || 0);
  }
  function avgHours(value) {
    if (Array.isArray(value)) return value.reduce((a, b) => a + Number(b || 0), 0) / value.length;
    return Number(value || 0);
  }
  function qualifies(teacher, subj) {
    if (teacher.subjects.includes(subj)) return true;
    return (FAMILY[subj] || []).some(s => teacher.subjects.includes(s));
  }

  g.SchoolData = { SUBJECTS, FAMILY, CURRICULUM, RULES, QUARTERS, HOLIDAYS, DAYS, BELLS, CLASS_LETTERS, DEMO_TEACHERS, hoursFor, avgHours, qualifies };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* =========================================================
   assign.js — Мұғалімдерді сыныптарға автоматты тағайындау
   Жүктемені тең бөледі, бір сыныптағы туыс пәндерді
   (алгебра+геометрия, қазақ тілі+әдебиеті) бір мұғалімге береді.
   ========================================================= */
(function (g) {
  'use strict';
  const D = g.SchoolData;

  /**
   * @param {Array} classes  [{id:'5А', grade:5, split:true}]
   * @param {Object} plan    {grade: {subj: hours|[h1..h4]}}
   * @param {Array} teachers [{id, name, subjects:[], maxHours}]
   * @returns {{assignments:Object, load:Object, unassigned:Array, overloaded:Array}}
   *   assignments[classId][subj] = [teacherId] (бөлінген топта 2 мұғалім)
   */
  function assignTeachers(classes, plan, teachers) {
    const load = {};
    teachers.forEach(t => { load[t.id] = 0; });
    const assignments = {};
    const tasks = [];

    classes.forEach(c => {
      assignments[c.id] = {};
      const subjects = plan[c.grade] || {};
      Object.keys(subjects).forEach(subj => {
        const hours = D.avgHours(subjects[subj]);
        if (hours <= 0) return;
        const groups = (c.split && D.SUBJECTS[subj] && D.SUBJECTS[subj].splittable) ? 2 : 1;
        assignments[c.id][subj] = [];
        for (let gi = 0; gi < groups; gi++) tasks.push({ cid: c.id, subj, hours, group: gi });
      });
    });

    const qualifiedCount = subj => teachers.filter(t => D.qualifies(t, subj)).length;
    // Сирек мамандықтағы пәндер мен көп сағатты пәндер алдымен
    tasks.sort((a, b) => (qualifiedCount(a.subj) - qualifiedCount(b.subj)) || (b.hours - a.hours));

    const unassigned = [];
    tasks.forEach(task => {
      const taken = assignments[task.cid][task.subj];
      const candidates = teachers.filter(t => D.qualifies(t, task.subj) && !taken.includes(t.id));
      if (!candidates.length) { unassigned.push(task); return; }

      let best = null, bestScore = Infinity;
      candidates.forEach(t => {
        const max = Number(t.maxHours) || D.RULES.teacherMaxDefault;
        const after = load[t.id] + task.hours;
        let score = after / max;
        if (after > max) score += 10 + (after - max);                 // асып кету — қатаң айыппұл
        if (t.subjects.includes(task.subj)) score -= 0.15;             // тікелей мамандығы
        const cls = assignments[task.cid];
        const family = D.FAMILY[task.subj] || [];
        if (family.some(f => (cls[f] || []).includes(t.id))) score -= 0.6; // туыс пән осы сыныпта
        if (Object.values(cls).some(arr => arr.includes(t.id))) score -= 0.1; // осы сыныпты біледі
        if (score < bestScore) { bestScore = score; best = t; }
      });
      taken.push(best.id);
      load[best.id] += task.hours;
    });

    const overloaded = teachers
      .filter(t => load[t.id] > (Number(t.maxHours) || D.RULES.teacherMaxDefault))
      .map(t => ({ id: t.id, load: load[t.id], max: Number(t.maxHours) || D.RULES.teacherMaxDefault }));

    return { assignments, load, unassigned, overloaded };
  }

  /** Қолмен өзгертілген тағайындаулар бойынша жүктемені қайта есептеу */
  function computeLoad(classes, plan, teachers, assignments) {
    const load = {};
    teachers.forEach(t => { load[t.id] = 0; });
    classes.forEach(c => {
      const subjects = plan[c.grade] || {};
      Object.keys(subjects).forEach(subj => {
        const hours = D.avgHours(subjects[subj]);
        ((assignments[c.id] || {})[subj] || []).forEach(tid => {
          if (tid in load) load[tid] += hours;
        });
      });
    });
    return load;
  }

  g.Assign = { assignTeachers, computeLoad };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* =========================================================
   scheduler.js — Сабақ кестесін құрастыру алгоритмі
   Әдіс: жинақы бастапқы орналастыру + имитациялық күйдіру
   (simulated annealing).

   Қатаң шектеулер (СанПиН / стандарт):
     • мұғалім бір уақытта екі сыныпта бола алмайды
     • сыныпта «терезе» (бос сабақ) болмайды — құрылымдық түрде
     • күнделікті сабақ саны шектен аспайды
     • мұғалімнің әдістемелік күні бос
     • бір пән күніне 2-ден көп болмайды
   Жұмсақ шектеулер:
     • қиын пәндер 2–4 сабақта, 1-ші және соңғы сабақта емес
     • апта ішіндегі жүктеме: сейсенбі/сәрсенбі ең ауыр, дүйсенбі/жұма жеңіл
     • бір пән бір күнде қайталанбайды (жұп сабаққа рұқсат етілгендерден басқа)
     • мұғалімдердің «терезесі» аз болады
   ========================================================= */
(function (g) {
  'use strict';

  const HARD = 1000;
  const POS_W = [0.35, 0, 0, 0.1, 0.35, 0.6, 0.9, 1.2];
  const DAY_F = [0.9, 1.08, 1.1, 1.0, 0.85, 0.75];

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /**
   * input = {
   *   days: 5,
   *   classes: [{id, maxPerDay}],
   *   lessons: {classId: [{subj, teachers:[tid], diff, double}]},
   *   teacherOff: {tid: [dayIndex]},
   *   seed, iterations
   * }
   */
  function Solver(input) {
    const D = input.days;
    const P = Math.max(...input.classes.map(c => c.maxPerDay));
    const rand = rng(input.seed || 1);
    const L = [];
    const tIndex = {};
    const tIds = [];
    const C = input.classes.length;
    const classLessons = [];
    const maxPD = [];

    input.classes.forEach((c, ci) => {
      maxPD[ci] = c.maxPerDay;
      classLessons[ci] = [];
      (input.lessons[c.id] || []).forEach(l => {
        const tis = l.teachers.map(tid => {
          if (!(tid in tIndex)) { tIndex[tid] = tIds.length; tIds.push(tid); }
          return tIndex[tid];
        });
        L.push({ ci, subj: l.subj, tis, diff: l.diff || 5, double: !!l.double });
        classLessons[ci].push(L.length - 1);
      });
      if (classLessons[ci].length > D * c.maxPerDay) {
        throw new Error('CAPACITY:' + c.id + ':' + classLessons[ci].length + ':' + (D * c.maxPerDay));
      }
    });

    const T = tIds.length;
    const off = tIds.map(tid => new Set((input.teacherOff || {})[tid] || []));
    const grid = Array.from({ length: C }, () => new Int32Array(D * P).fill(-1));
    const count = Array.from({ length: C }, () => new Int8Array(D));
    const tcount = new Int16Array(Math.max(1, T * D * P));
    const avgDaily = [];

    // --- Бастапқы жинақы орналастыру ---
    const extraOrder = [2, 1, 3, 0, 4, 5].filter(d => d < D);
    for (let ci = 0; ci < C; ci++) {
      const n = classLessons[ci].length;
      const base = Math.floor(n / D);
      let rem = n % D;
      for (let d = 0; d < D; d++) count[ci][d] = base;
      for (const d of extraOrder) { if (rem <= 0) break; count[ci][d]++; rem--; }

      const bySubj = {};
      classLessons[ci].forEach(li => { (bySubj[L[li].subj] = bySubj[L[li].subj] || []).push(li); });
      const ordered = Object.values(bySubj).sort((a, b) => b.length - a.length).flat();
      const dayLists = Array.from({ length: D }, () => []);
      let ptr = 0;
      ordered.forEach(li => {
        for (let k = 0; k < D; k++) {
          const d = (ptr + k) % D;
          if (dayLists[d].length < count[ci][d]) { dayLists[d].push(li); ptr = d + 1; return; }
        }
      });
      let sum = 0;
      dayLists.forEach((list, d) => list.forEach((li, p) => { grid[ci][d * P + p] = li; sum += L[li].diff; }));
      avgDaily[ci] = sum / D;
    }
    for (let ci = 0; ci < C; ci++) for (let s = 0; s < D * P; s++) {
      const li = grid[ci][s]; if (li < 0) continue;
      L[li].tis.forEach(ti => { tcount[ti * D * P + s]++; });
    }

    // --- Құн функциялары ---
    function classDayCost(ci, d) {
      let cost = 0, dsum = 0;
      const n = count[ci][d];
      const pos = {};
      for (let p = 0; p < n; p++) {
        const l = L[grid[ci][d * P + p]];
        dsum += l.diff;
        cost += l.diff * (POS_W[p] || 1.5);
        if (l.subj === 'pe' && p === 0) cost += 1;
        (pos[l.subj] = pos[l.subj] || []).push(p);
      }
      for (const subj in pos) {
        const arr = pos[subj];
        if (arr.length === 2) {
          const l = L[grid[ci][d * P + arr[0]]];
          const consecutive = arr[1] - arr[0] === 1;
          cost += (l.double && consecutive) ? 2 : (consecutive ? 25 : 40);
        } else if (arr.length > 2) {
          cost += HARD * (arr.length - 2) + 40;
        }
      }
      cost += Math.abs(dsum - avgDaily[ci] * (DAY_F[d] || 1)) * 0.15;
      return cost;
    }

    function teacherDayCost(ti, d) {
      let cost = 0, first = -1, last = -1, busy = 0;
      const base = (ti * D + d) * P;
      for (let p = 0; p < P; p++) {
        const c = tcount[base + p];
        if (c > 0) { busy++; if (first < 0) first = p; last = p; }
        if (c > 1) cost += HARD * (c - 1);
      }
      if (busy) {
        cost += 1.5 * ((last - first + 1) - busy);
        if (off[ti].has(d)) cost += HARD * busy;
      }
      return cost;
    }

    function totalCost() {
      let s = 0;
      for (let ci = 0; ci < C; ci++) for (let d = 0; d < D; d++) s += classDayCost(ci, d);
      for (let ti = 0; ti < T; ti++) for (let d = 0; d < D; d++) s += teacherDayCost(ti, d);
      return s;
    }

    function setCell(ci, slot, li) {
      const old = grid[ci][slot];
      if (old >= 0) L[old].tis.forEach(ti => { tcount[ti * D * P + slot]--; });
      grid[ci][slot] = li;
      if (li >= 0) L[li].tis.forEach(ti => { tcount[ti * D * P + slot]++; });
    }

    function localCost(ci, days, tis) {
      let s = 0;
      for (const d of days) s += classDayCost(ci, d);
      for (const ti of tis) for (const d of days) s += teacherDayCost(ti, d);
      return s;
    }

    function conflictCells() {
      const out = [];
      for (let ci = 0; ci < C; ci++) for (let d = 0; d < D; d++) for (let p = 0; p < count[ci][d]; p++) {
        const slot = d * P + p;
        const l = L[grid[ci][slot]];
        if (l.tis.some(ti => tcount[ti * D * P + slot] > 1 || off[ti].has(d))) out.push([ci, d, p]);
      }
      return out;
    }

    let cost = totalCost();
    let best = cost;
    let bestGrid = grid.map(a => a.slice());
    let bestCount = count.map(a => a.slice());
    const iterations = input.iterations || Math.min(400000, 60000 + 10000 * C);
    const T0 = 40, T1 = 0.05;
    let it = 0;
    let hot = [];

    function step() {
      if (it % 2000 === 0) hot = conflictCells();
      const temp = T0 * Math.pow(T1 / T0, it / iterations);
      let ci, d1, p1;
      if (hot.length && rand() < 0.6) {
        [ci, d1, p1] = hot[Math.floor(rand() * hot.length)];
        if (p1 >= count[ci][d1]) { it++; return; }
      } else {
        ci = Math.floor(rand() * C);
        d1 = Math.floor(rand() * D);
        if (!count[ci][d1]) { it++; return; }
        p1 = Math.floor(rand() * count[ci][d1]);
      }

      if (rand() < 0.85) {
        // 1-қадам: сынып ішінде екі сабақтың орнын ауыстыру
        const d2 = Math.floor(rand() * D);
        if (!count[ci][d2]) { it++; return; }
        const p2 = Math.floor(rand() * count[ci][d2]);
        const s1 = d1 * P + p1, s2 = d2 * P + p2;
        const a = grid[ci][s1], b = grid[ci][s2];
        if (s1 === s2 || L[a].subj === L[b].subj) { it++; return; }
        const days = d1 === d2 ? [d1] : [d1, d2];
        const tis = [...new Set([...L[a].tis, ...L[b].tis])];
        const before = localCost(ci, days, tis);
        setCell(ci, s1, b); setCell(ci, s2, a);
        const delta = localCost(ci, days, tis) - before;
        if (delta <= 0 || rand() < Math.exp(-delta / temp)) cost += delta;
        else { setCell(ci, s1, a); setCell(ci, s2, b); }
      } else {
        // 2-қадам: күннің соңғы сабағын басқа күннің соңына көшіру (терезесіз)
        const d2 = Math.floor(rand() * D);
        if (d2 === d1 || count[ci][d1] <= 1 || count[ci][d2] >= maxPD[ci]) { it++; return; }
        const from = d1 * P + count[ci][d1] - 1;
        const to = d2 * P + count[ci][d2];
        const li = grid[ci][from];
        const tis = L[li].tis;
        const before = localCost(ci, [d1, d2], tis);
        setCell(ci, from, -1); count[ci][d1]--;
        setCell(ci, to, li); count[ci][d2]++;
        const delta = localCost(ci, [d1, d2], tis) - before;
        if (delta <= 0 || rand() < Math.exp(-delta / temp)) cost += delta;
        else {
          setCell(ci, to, -1); count[ci][d2]--;
          setCell(ci, from, li); count[ci][d1]++;
        }
      }
      if (cost < best - 1e-9) {
        best = cost;
        bestGrid = grid.map(a => a.slice());
        bestCount = count.map(a => a.slice());
      }
      it++;
    }

    this.run = async function (onProgress) {
      const CHUNK = 5000;
      while (it < iterations) {
        const end = Math.min(iterations, it + CHUNK);
        while (it < end) step();
        if (onProgress) onProgress(it / iterations, best);
        await new Promise(r => setTimeout(r, 0));
      }
      // Ең жақсы шешімді қалпына келтіру
      for (let ci = 0; ci < C; ci++) {
        for (let s = 0; s < D * P; s++) setCell(ci, s, bestGrid[ci][s]);
        count[ci].set(bestCount[ci]);
      }
      return this.result();
    };

    this.result = function () {
      const out = {};
      const violations = [];
      input.classes.forEach((c, ci) => {
        out[c.id] = [];
        for (let d = 0; d < D; d++) {
          const row = [];
          for (let p = 0; p < P; p++) {
            const li = grid[ci][d * P + p];
            if (li < 0) { row.push(null); continue; }
            const l = L[li];
            const tids = l.tis.map(ti => tIds[ti]);
            const conflict = l.tis.some(ti => tcount[ti * D * P + d * P + p] > 1);
            const offDay = l.tis.some(ti => off[ti].has(d));
            row.push({ subj: l.subj, teachers: tids, conflict, offDay });
            if (conflict) violations.push({ type: 'teacher', classId: c.id, day: d, period: p, subj: l.subj, teachers: tids });
            if (offDay) violations.push({ type: 'offday', classId: c.id, day: d, period: p, subj: l.subj, teachers: tids });
          }
          const seen = {};
          row.forEach(x => { if (x) seen[x.subj] = (seen[x.subj] || 0) + 1; });
          Object.keys(seen).forEach(s => { if (seen[s] > 2) violations.push({ type: 'triple', classId: c.id, day: d, subj: s }); });
          out[c.id].push(row);
        }
      });
      return { grid: out, cost: Math.round(best), violations, days: D, periods: P, iterations };
    };
  }

  /** Сабақтардың тізімін құру (бір тоқсанға) */
  function buildLessons(classes, plan, assignments, quarter) {
    const SD = g.SchoolData;
    const lessons = {};
    const missing = [];
    classes.forEach(c => {
      lessons[c.id] = [];
      const subjects = plan[c.grade] || {};
      Object.keys(subjects).forEach(subj => {
        const h = Math.round(SD.hoursFor(subjects[subj], quarter));
        if (h <= 0) return;
        const tids = ((assignments[c.id] || {})[subj] || []).filter(Boolean);
        if (!tids.length) { missing.push({ classId: c.id, subj }); return; }
        const meta = SD.SUBJECTS[subj] || {};
        for (let i = 0; i < h; i++) lessons[c.id].push({ subj, teachers: tids, diff: meta.diff || 5, double: !!meta.double });
      });
    });
    return { lessons, missing };
  }

  /** Кестені қолмен өзгерткеннен кейін қайшылықтарды қайта тексеру */
  function validate(grid, teacherOff) {
    const busy = {};
    const violations = [];
    Object.keys(grid).forEach(cid => grid[cid].forEach((row, d) => row.forEach((x, p) => {
      if (!x) return;
      x.teachers.forEach(t => { const k = t + '|' + d + '|' + p; busy[k] = (busy[k] || 0) + 1; });
    })));
    Object.keys(grid).forEach(cid => grid[cid].forEach((row, d) => {
      const seen = {};
      row.forEach((x, p) => {
        if (!x) return;
        x.conflict = x.teachers.some(t => busy[t + '|' + d + '|' + p] > 1);
        x.offDay = x.teachers.some(t => ((teacherOff || {})[t] || []).includes(d));
        if (x.conflict) violations.push({ type: 'teacher', classId: cid, day: d, period: p, subj: x.subj, teachers: x.teachers });
        if (x.offDay) violations.push({ type: 'offday', classId: cid, day: d, period: p, subj: x.subj, teachers: x.teachers });
        seen[x.subj] = (seen[x.subj] || 0) + 1;
      });
      Object.keys(seen).forEach(s => { if (seen[s] > 2) violations.push({ type: 'triple', classId: cid, day: d, subj: s }); });
      // терезе тексеру
      let gap = false, endSeen = false;
      row.forEach(x => { if (!x) endSeen = true; else if (endSeen) gap = true; });
      if (gap) violations.push({ type: 'gap', classId: cid, day: d });
    }));
    return violations;
  }

  async function generate(input, onProgress) {
    const solver = new Solver(input);
    return solver.run(onProgress);
  }

  g.Scheduler = { generate, buildLessons, validate };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* =========================================================
   ai.js — Жасанды интеллект интеграциясы (Google Gemini / Claude API)
   • Кестені СанПиН бойынша талдау
   • ҚТЖ (күнтізбелік-тақырыптық жоспар) тақырыптарын толтыру
   • ОМЖ (орта мерзімді жоспар) құру
   • Чат-көмекші
   API кілті тек браузердің localStorage-інде сақталады.
   ========================================================= */
(function (g) {
  'use strict';

  const API_URL = 'https://api.anthropic.com/v1/messages';
  const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const DEFAULTS = { gemini: 'gemini-3.8-flash', claude: 'claude-sonnet-5-5' };
  const DEFAULT_MODEL = DEFAULTS.gemini;
  const aiStoreKey = () => 'sss_ai' + (g.Auth ? ':' + g.Auth.dataId() : '');

  // Баптаулар: { provider, keys:{gemini,claude}, models:{gemini,claude} }
  function raw() {
    let s = {};
    try { s = JSON.parse(localStorage.getItem(aiStoreKey()) || '{}'); } catch (e) { /* бос */ }
    if (!s.keys) { // ескі нұсқадан көшіру
      s = { provider: s.apiKey ? 'claude' : 'gemini', keys: { claude: s.apiKey || '', gemini: '' },
            models: { claude: s.model || DEFAULTS.claude, gemini: DEFAULTS.gemini } };
    }
    s.models = Object.assign({}, DEFAULTS, s.models || {});
    s.provider = s.provider || 'gemini';
    return s;
  }
  function settings() {
    const s = raw();
    return { provider: s.provider, apiKey: s.keys[s.provider] || '', model: s.models[s.provider] || DEFAULTS[s.provider], all: s };
  }
  function saveSettings(s) {
    try { localStorage.setItem(aiStoreKey(), JSON.stringify(s)); } catch (e) { /* бос */ }
  }

  async function errorText(res) {
    let msg = res.status + ' ' + res.statusText;
    try { const j = await res.json(); if (j.error) msg += ': ' + (j.error.message || JSON.stringify(j.error)); } catch (e) { /* бос */ }
    if (res.status === 429) msg += ' — тегін лимит таусылды, біраз күтіп қайталаңыз / free quota reached, try again later';
    return msg;
  }

  async function callClaude(messages, system, maxTokens, apiKey, model) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model, max_tokens: maxTokens || 4000, system, messages })
    });
    if (!res.ok) throw new Error(await errorText(res));
    const data = await res.json();
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  }

  async function callGemini(messages, system, maxTokens, apiKey, model) {
    const body = {
      systemInstruction: { parts: [{ text: system }] },
      contents: messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      generationConfig: { maxOutputTokens: Math.max(8192, (maxTokens || 4000) * 2) }
    };
    const res = await fetch(GEMINI_URL + encodeURIComponent(model) + ':generateContent', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(await errorText(res));
    const data = await res.json();
    const cand = (data.candidates || [])[0];
    if (!cand) throw new Error('Gemini: ' + ((data.promptFeedback || {}).blockReason || 'бос жауап / empty response'));
    return ((cand.content || {}).parts || []).filter(p => p.text && !p.thought).map(p => p.text).join('\n');
  }

  async function call(messages, system, maxTokens) {
    const { provider, apiKey, model } = settings();
    if (!apiKey) throw new Error('NO_KEY');
    return provider === 'claude'
      ? callClaude(messages, system, maxTokens, apiKey, model)
      : callGemini(messages, system, maxTokens, apiKey, model);
  }

  function extractJSON(text) {
    const start = text.search(/[[{]/);
    if (start < 0) throw new Error('AI JSON қайтармады / AI returned no JSON');
    const open = text[start], close = open === '[' ? ']' : '}';
    const end = text.lastIndexOf(close);
    return JSON.parse(text.slice(start, end + 1));
  }

  const langName = lang => (lang === 'en' ? 'English' : 'Kazakh (қазақ тілі)');

  const SYSTEM_METHODIST =
    'You are an experienced methodologist of secondary schools of the Republic of Kazakhstan. ' +
    'You know the updated content of education (жаңартылған білім мазмұны), the State compulsory standard of education (МЖМБС), ' +
    'model curricula and programs (үлгілік оқу жоспары, үлгілік оқу бағдарламасы), and the formats of ҚТЖ ' +
    '(күнтізбелік-тақырыптық жоспар) and ОМЖ (орта мерзімді жоспар). Use learning objective codes like 7.1.2.1 where appropriate. ' +
    'Be accurate and practical.';

  /** ҚТЖ: дәл n сабаққа тақырыптар */
  async function generateKTP({ subject, grade, quarter, count, lang }) {
    const prompt =
      `Create the calendar-thematic plan (ҚТЖ) for "${subject}", grade ${grade}, quarter ${quarter}. ` +
      `There must be EXACTLY ${count} lessons (one row per lesson, hours = 1). Include the section (бөлім), lesson topic, ` +
      `learning objectives (with codes if applicable), and mark summative assessment lessons (БЖБ/ТЖБ) where appropriate. ` +
      `Write all text in ${langName(lang)}. ` +
      'Return ONLY a JSON array, no commentary: [{"section":"...","topic":"...","objectives":"...","type":"lesson|БЖБ|ТЖБ"}]';
    const text = await call([{ role: 'user', content: prompt }], SYSTEM_METHODIST, 12000);
    const arr = extractJSON(text);
    return Array.isArray(arr) ? arr : [];
  }

  /** ОМЖ: тоқсанға арналған бөлімдер */
  async function generateOMJ({ subject, grade, quarter, hours, lang }) {
    const prompt =
      `Create the medium-term plan (ОМЖ) for "${subject}", grade ${grade}, quarter ${quarter}, total ${hours} hours. ` +
      `Split into sections (бөлімдер) with hours per section summing to ${hours}. For each section give: topics, ` +
      `learning objectives (with codes), expected results, and assessment (formative / БЖБ). Write in ${langName(lang)}. ` +
      'Return ONLY JSON: [{"section":"...","hours":N,"topics":["..."],"objectives":["..."],"results":"...","assessment":"..."}]';
    const text = await call([{ role: 'user', content: prompt }], SYSTEM_METHODIST, 8000);
    const arr = extractJSON(text);
    return Array.isArray(arr) ? arr : [];
  }

  /** Кестені талдау */
  async function analyzeSchedule(summary, lang) {
    const system =
      'You are an expert on school timetabling in Kazakhstan: sanitary rules (СанПиН), the difficulty scale of subjects, ' +
      'teacher workload rules (16 h = 1 rate). Evaluate the timetable and give concrete, prioritized recommendations ' +
      `(which class, which day, what to swap). Answer in ${langName(lang)}, using short headings and bullet points.`;
    return call([{ role: 'user', content: summary }], system, 3000);
  }

  /** Еркін чат (мектеп деректері контекст ретінде беріледі) */
  async function chat(history, context, lang) {
    const system =
      'You are the AI assistant of a school timetable website for Kazakhstan grades 5–11. ' +
      `Help the deputy director with timetables, teacher workload, ҚТЖ, ОМЖ, СанПиН. Reply in ${langName(lang)} unless asked otherwise.\n\n` +
      'Current school data:\n' + context;
    return call(history, system, 3000);
  }

  g.AI = { settings, saveSettings, generateKTP, generateOMJ, analyzeSchedule, chat, DEFAULT_MODEL, DEFAULTS };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* =========================================================
   app.js — Интерфейс логикасы
   ========================================================= */
window.startApp = function () {
  'use strict';
  const D = window.SchoolData;
  const t = k => I18N.t(k);
  const $ = id => document.getElementById(id);
  const GRADES = [5, 6, 7, 8, 9, 10, 11];

  // ---------------- КҮЙ (STATE) ----------------
  function defaultState() {
    const grades = {};
    GRADES.forEach(g => { grades[g] = { count: 1, split: false }; });
    return {
      grades, days: 5,
      quarters: JSON.parse(JSON.stringify(D.QUARTERS)),
      holidays: D.HOLIDAYS.slice(),
      teachers: [],
      plan: JSON.parse(JSON.stringify(D.CURRICULUM)),
      assignments: {},
      schedules: [null, null, null, null],
      ktp: {}
    };
  }
  let state = defaultState();
  try {
    const saved = JSON.parse(Auth.initialState() || 'null'); // бұлттан / браузерден жүктелген
    if (saved) state = Object.assign(defaultState(), saved);
  } catch (e) { /* бос */ }

  function save() {
    Auth.persist(state); // Firebase-ке (немесе браузерге) сақтау
  }

  // ---------------- КӨМЕКШІЛЕР ----------------
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const subjName = s => (D.SUBJECTS[s] ? D.SUBJECTS[s][I18N.lang] : s);
  const dayName = d => D.DAYS[I18N.lang][d];
  const teacherById = id => state.teachers.find(x => x.id === id);
  const tName = id => { const x = teacherById(id); return x ? x.name : '?'; };
  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = 'toast'; }, 3500);
  }

  function classes() {
    const out = [];
    GRADES.forEach(g => {
      const cfg = state.grades[g] || { count: 0 };
      for (let i = 0; i < (Number(cfg.count) || 0); i++) {
        out.push({ id: g + D.CLASS_LETTERS[i], grade: g, split: !!cfg.split });
      }
    });
    return out;
  }

  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function iso(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function fmt(dt) { return String(dt.getDate()).padStart(2, '0') + '.' + String(dt.getMonth() + 1).padStart(2, '0') + '.' + dt.getFullYear(); }
  const weekday = dt => (dt.getDay() + 6) % 7; // Дүйсенбі = 0

  function schoolDates(q) {
    const qq = state.quarters[q];
    if (!qq || !qq.start || !qq.end) return [];
    const hol = new Set(state.holidays);
    const out = [];
    for (let dt = parseDate(qq.start); dt <= parseDate(qq.end); dt.setDate(dt.getDate() + 1)) {
      if (weekday(dt) < state.days && !hol.has(iso(dt))) out.push(new Date(dt));
    }
    return out;
  }
  const weeksIn = q => Math.round(schoolDates(q).length / state.days);

  function teacherOffMap() {
    const m = {};
    state.teachers.forEach(x => { if (x.offDay >= 0) m[x.id] = [Number(x.offDay)]; });
    return m;
  }

  function planSubjects() {
    const set = [];
    Object.keys(D.SUBJECTS).forEach(s => {
      if (GRADES.some(g => state.plan[g] && state.plan[g][s] !== undefined)) set.push(s);
    });
    return set;
  }

  // ---------------- ТАБТАР ----------------
  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + btn.dataset.tab));
      renderTab(btn.dataset.tab);
    });
  });
  const activeTab = () => (document.querySelector('#tabs button.active') || {}).dataset.tab;

  function renderTab(tab) {
    ({ school: renderSchool, teachers: renderTeachers, plan: renderPlan, load: renderLoad,
       schedule: renderSchedule, ktp: renderKtpControls, ai: renderAiControls, users: () => Auth.renderUsers() }[tab] || (() => {}))();
  }

  // ---------------- ТІЛ ----------------
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.addEventListener('click', () => { I18N.setLang(b.dataset.lang); applyLang(); });
  });
  function applyLang() {
    I18N.apply();
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === I18N.lang));
    $('chatInput').placeholder = t('chatPlaceholder');
    renderTab(activeTab());
    renderTeacherForm();
    Auth.onLang();
  }

  // ================= 1. МЕКТЕП =================
  function renderSchool() {
    let h = `<tr><th>${t('grade')}</th><th>${t('classCount')}</th><th>${t('splitGroups')}</th></tr>`;
    GRADES.forEach(g => {
      const c = state.grades[g];
      h += `<tr><td><b>${g}</b></td>
        <td><input type="number" min="0" max="8" value="${c.count}" data-grade="${g}" class="g-count num"></td>
        <td><input type="checkbox" ${c.split ? 'checked' : ''} data-grade="${g}" class="g-split"></td></tr>`;
    });
    $('gradeTable').innerHTML = h;
    $('gradeTable').querySelectorAll('.g-count').forEach(el => el.addEventListener('change', () => {
      state.grades[el.dataset.grade].count = Math.max(0, Math.min(8, Number(el.value) || 0)); save();
    }));
    $('gradeTable').querySelectorAll('.g-split').forEach(el => el.addEventListener('change', () => {
      state.grades[el.dataset.grade].split = el.checked; save();
    }));
    $('daysPerWeek').value = String(state.days);

    let q = `<tr><th>${t('quarter')}</th><th>${t('start')}</th><th>${t('end')}</th><th>${t('schoolDays')}</th><th>${t('weeks')}</th></tr>`;
    state.quarters.forEach((qq, i) => {
      q += `<tr><td><b>${['I', 'II', 'III', 'IV'][i]}</b></td>
        <td><input type="date" value="${qq.start}" data-q="${i}" data-k="start" class="q-date"></td>
        <td><input type="date" value="${qq.end}" data-q="${i}" data-k="end" class="q-date"></td>
        <td>${schoolDates(i).length}</td><td><b>${weeksIn(i)}</b></td></tr>`;
    });
    $('quarterTable').innerHTML = q;
    $('quarterTable').querySelectorAll('.q-date').forEach(el => el.addEventListener('change', () => {
      state.quarters[el.dataset.q][el.dataset.k] = el.value; save(); renderSchool();
    }));
    $('holidays').value = state.holidays.join('\n');
  }
  $('daysPerWeek').addEventListener('change', e => { state.days = Number(e.target.value); state.schedules = [null, null, null, null]; save(); renderSchool(); renderTeacherForm(); });
  $('holidays').addEventListener('change', e => {
    state.holidays = e.target.value.split(/\s+/).map(s => s.trim()).filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s));
    save(); renderSchool();
  });

  $('btnDemo').addEventListener('click', () => {
    GRADES.forEach(g => { state.grades[g] = { count: 2, split: g >= 7 }; });
    state.teachers = JSON.parse(JSON.stringify(D.DEMO_TEACHERS));
    state.assignments = {}; state.schedules = [null, null, null, null];
    save(); renderSchool(); toast(t('demoLoaded'));
  });
  $('btnExport').addEventListener('click', () => {
    download('school-schedule.json', JSON.stringify(state, null, 2), 'application/json');
  });
  $('fileImport').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { state = Object.assign(defaultState(), JSON.parse(r.result)); save(); renderSchool(); toast(t('imported')); }
      catch (err) { toast(t('importError'), true); }
    };
    r.readAsText(f); e.target.value = '';
  });
  $('btnReset').addEventListener('click', () => {
    if (!confirm(t('confirmReset'))) return;
    state = defaultState(); save(); renderSchool();
  });

  function download(name, content, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ================= 2. МҰҒАЛІМДЕР =================
  let editingId = null;
  let formSubjects = new Set();

  function renderTeacherForm() {
    let opts = `<option value="-1">${t('none')}</option>`;
    for (let d = 0; d < state.days; d++) opts += `<option value="${d}">${dayName(d)}</option>`;
    const cur = $('tOff').value;
    $('tOff').innerHTML = opts;
    $('tOff').value = cur && Number(cur) < state.days ? cur : '-1';
    $('tSubjects').innerHTML = Object.keys(D.SUBJECTS).map(s =>
      `<button type="button" class="chip ${formSubjects.has(s) ? 'on' : ''}" data-s="${s}" style="--c:${D.SUBJECTS[s].color}">${esc(subjName(s))}</button>`).join('');
    $('tSubjects').querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
      formSubjects.has(ch.dataset.s) ? formSubjects.delete(ch.dataset.s) : formSubjects.add(ch.dataset.s);
      ch.classList.toggle('on');
    }));
    $('btnAddTeacher').textContent = editingId ? t('updateTeacher') : t('addTeacher');
    $('btnCancelEdit').hidden = !editingId;
  }

  function renderTeachers() {
    renderTeacherForm();
    $('teacherCount').textContent = state.teachers.length;
    if (!state.teachers.length) { $('teacherTable').innerHTML = `<tr><td class="empty">${t('noTeachers')}</td></tr>`; return; }
    let h = `<tr><th>#</th><th>${t('teacherName')}</th><th>${t('subject')}</th><th>${t('maxHours')}</th><th>${t('offDay')}</th><th></th></tr>`;
    state.teachers.forEach((x, i) => {
      h += `<tr><td>${i + 1}</td><td><b>${esc(x.name)}</b></td>
        <td>${x.subjects.map(s => `<span class="tag" style="--c:${D.SUBJECTS[s] ? D.SUBJECTS[s].color : '#888'}">${esc(subjName(s))}</span>`).join(' ')}</td>
        <td>${x.maxHours}</td><td>${x.offDay >= 0 ? dayName(x.offDay) : t('none')}</td>
        <td class="nowrap"><button class="btn sm" data-edit="${x.id}">${t('edit')}</button>
        <button class="btn sm danger" data-del="${x.id}">${t('del')}</button></td></tr>`;
    });
    $('teacherTable').innerHTML = h;
    $('teacherTable').querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
      const x = teacherById(b.dataset.edit);
      editingId = x.id; formSubjects = new Set(x.subjects);
      $('tName').value = x.name; $('tMax').value = x.maxHours;
      renderTeacherForm(); $('tOff').value = String(x.offDay);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }));
    $('teacherTable').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      state.teachers = state.teachers.filter(x => x.id !== b.dataset.del);
      Object.values(state.assignments).forEach(cls => Object.keys(cls).forEach(s => { cls[s] = cls[s].filter(id => id !== b.dataset.del); }));
      save(); renderTeachers();
    }));
  }

  $('btnAddTeacher').addEventListener('click', () => {
    const name = $('tName').value.trim();
    if (!name || !formSubjects.size) { toast(t('needName'), true); return; }
    const data = { name, subjects: [...formSubjects], maxHours: Number($('tMax').value) || D.RULES.teacherMaxDefault, offDay: Number($('tOff').value) };
    if (editingId) Object.assign(teacherById(editingId), data);
    else state.teachers.push(Object.assign({ id: uid() }, data));
    editingId = null; formSubjects = new Set(); $('tName').value = ''; $('tMax').value = D.RULES.teacherMaxDefault;
    save(); renderTeachers(); toast(t('saved'));
  });
  $('btnCancelEdit').addEventListener('click', () => {
    editingId = null; formSubjects = new Set(); $('tName').value = ''; renderTeachers();
  });


  // ---------- Мұғалімдерді Excel-ден жүктеу / Excel-ге сақтау ----------
  const XLSX_URL = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  let xlsxLoading = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxLoading) {
      xlsxLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = XLSX_URL;
        s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('XLSX')));
        s.onerror = () => { xlsxLoading = null; s.remove(); reject(new Error('XLSX')); };
        document.head.appendChild(s);
      });
    }
    return xlsxLoading;
  }

  const normTxt = s => String(s == null ? '' : s).toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

  // Пән атауларының синонимдері (қазақша / орысша / ағылшынша)
  const SUBJ_ALIASES = {
    'қазақ тілі мен әдебиеті': ['kaz_lang', 'kaz_lit'], 'қазақ тілі және әдебиеті': ['kaz_lang', 'kaz_lit'],
    'казахский язык': ['kaz_lang'], 'казахская литература': ['kaz_lit'], 'казахский язык и литература': ['kaz_lang', 'kaz_lit'],
    'орыс тілі': ['rus'], 'орыс әдебиеті': ['rus'], 'русский язык': ['rus'], 'русская литература': ['rus'],
    'русский язык и литература': ['rus'], 'russian': ['rus'],
    'ағылшын': ['eng'], 'английский': ['eng'], 'английский язык': ['eng'],
    'maths': ['math'], 'math': ['math'],
    'ақпараттық технологиялар': ['informatics'], 'ict': ['informatics'], 'икт': ['informatics'],
    'естествознание': ['science'],
    'история казахстана': ['hist_kz'], 'всемирная история': ['hist_world'], 'дүние жүзі тарихы': ['hist_world'],
    'тарих': ['hist_kz', 'hist_world'], 'история': ['hist_kz', 'hist_world'], 'history': ['hist_kz', 'hist_world'],
    'құқық': ['law'], 'основы права': ['law'], 'право': ['law'],
    'художественный труд': ['art'], 'еңбекке баулу': ['art'], 'технология': ['art'], 'труд': ['art'],
    'физическая культура': ['pe'], 'физкультура': ['pe'], 'pe': ['pe'],
    'аәтд': ['nvtp'], 'нвтп': ['nvtp'], 'нвп': ['nvtp'], 'әскери дайындық': ['nvtp']
  };
  const aliasIndex = (() => {
    const list = [];
    Object.keys(D.SUBJECTS).forEach(k => {
      [k, k.replace(/_/g, ' '), D.SUBJECTS[k].kk, D.SUBJECTS[k].en].forEach(a => list.push([normTxt(a), [k]]));
    });
    Object.keys(SUBJ_ALIASES).forEach(a => list.push([normTxt(a), SUBJ_ALIASES[a]]));
    return list.filter(x => x[0]);
  })();
  function matchSubject(raw, exactOnly) {
    const n = normTxt(raw);
    if (!n) return null;
    const exact = aliasIndex.find(([a]) => a === n);
    if (exact) return exact[1];
    if (exactOnly) return null;
    let best = null, bestLen = 0;
    aliasIndex.forEach(([a, keys]) => {
      const ok = (a.length >= 4 && n.includes(a)) || (n.length >= 4 && a.startsWith(n));
      if (ok && a.length > bestLen) { best = keys; bestLen = a.length; }
    });
    return best;
  }

  const DAY_PREFIX = [['дүй', 'дуй', 'пон', 'mon'], ['сей', 'вто', 'tue'], ['сәр', 'сар', 'сре', 'wed'],
                      ['бей', 'чет', 'thu'], ['жұм', 'жум', 'пят', 'fri'], ['сен', 'суб', 'sat']];
  function parseDay(v) {
    const n = normTxt(v);
    if (!n) return -1;
    if (/^[1-6]$/.test(n)) return Number(n) - 1;
    return DAY_PREFIX.findIndex(ps => ps.some(p => n.startsWith(p)));
  }

  function parseCsv(text) {
    text = String(text).replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function parseTeacherRows(rows) {
    rows = (rows || []).filter(r => Array.isArray(r) && r.some(c => String(c).trim()));
    const KW = {
      off: /(әдіст|адист|методич|демалыс|выходн|day off|off day|methodical)/,
      hours: /(сағат|сагат|час|hour|макс|max|жүктеме|нагрузк)/,
      subj: /(пән|предмет|subject|дисципл)/,
      name: /(аты|фио|ф и о|name|мұғалім|учител|педагог|teacher)/
    };
    let head = -1, cols = { name: 0, subj: 1, hours: 2, off: 3 };
    for (let i = 0; i < Math.min(5, rows.length); i++) {
      const found = {};
      rows[i].forEach((c, ci) => {
        const n = normTxt(c);
        for (const k of ['off', 'hours', 'subj', 'name']) if (!(k in found) && KW[k].test(n)) { found[k] = ci; break; }
      });
      if ('name' in found) {
        head = i;
        cols = { name: found.name, subj: 'subj' in found ? found.subj : found.name + 1,
                 hours: 'hours' in found ? found.hours : -1, off: 'off' in found ? found.off : -1 };
        break;
      }
    }
    const cell = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
    const byName = new Map();
    rows.slice(head + 1).forEach(r => {
      const name = cell(r, cols.name).replace(/\s+/g, ' ');
      if (!name || /^\d+$/.test(name)) return;
      const subjCell = cell(r, cols.subj);
      const subjects = new Set(), unknown = [];
      const whole = matchSubject(subjCell, true);
      const parts = whole ? [subjCell] : subjCell.split(/[,;\/\n+|]+/);
      parts.map(s => s.trim()).filter(Boolean).forEach(p => {
        const keys = whole && p === subjCell ? whole : matchSubject(p);
        if (keys) keys.forEach(k => subjects.add(k)); else unknown.push(p);
      });
      let maxHours = parseFloat(cell(r, cols.hours).replace(',', '.'));
      maxHours = maxHours > 0 ? Math.min(40, Math.round(maxHours)) : D.RULES.teacherMaxDefault;
      let offDay = parseDay(cell(r, cols.off));
      if (offDay >= state.days) offDay = -1;
      const key = normTxt(name);
      const prev = byName.get(key);
      if (prev) { subjects.forEach(s => { if (!prev.subjects.includes(s)) prev.subjects.push(s); }); prev.unknown.push(...unknown); return; }
      byName.set(key, { name, subjects: [...subjects], unknown, maxHours, offDay });
    });
    return [...byName.values()];
  }

  let excelData = null;
  function renderExcelPreview() {

      <div class="scroll"><table class="tbl"><tr><th>#</th><th>${t('teacherName')}</th><th>${t('colSubjects')}</th><th>${t('maxHours')}</th><th>${t('offDay')}</th><th></th></tr>`;

      h += `<tr class="${r.subjects.length ? '' : 'muted'}"><td>${i + 1}</td><td><b>${esc(r.name)}</b></td><td>${tags}</td>
        <td>${r.maxHours}</td><td>${r.offDay >= 0 ? dayName(r.offDay) : t('none')}</td><td>${st}</td></tr>`;
    });
    h += `</table></div>
      <div class="excel-opts">

        <label><input type="radio" name="exMode" value="replace"> ${t('excelReplace')}</label>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnExcelImport" ${ready ? '' : 'disabled'}>${t('excelImport')} (${ready})</button>
        <button class="btn" id="btnExcelCancel">${t('cancel')}</button>

  function doExcelImport() {
    const mode = (document.querySelector('input[name="exMode"]:checked') || {}).value || 'append';
    const rows = excelData.filter(r => r.subjects.length);
    if (mode === 'replace') {
      if (!confirm(t('confirmReplace'))) return;
      state.teachers = []; state.assignments = {}; state.schedules = [null, null, null, null];
    }
    let added = 0, updated = 0;
    rows.forEach(r => {
      const data = { name: r.name, subjects: r.subjects.slice(), maxHours: r.maxHours, offDay: r.offDay };
      const ex = state.teachers.find(x => normTxt(x.name) === normTxt(r.name));
      if (ex) { Object.assign(ex, data); updated++; }
      else { state.teachers.push(Object.assign({ id: uid() + added }, data)); added++; }
    });
    excelData = null;
    save(); renderTeachers(); renderExcelPreview();
    toast(`${t('excelDone')}: +${added} ${t('excelNew')}, ${updated} ${t('excelUpdated')}`);
  }

  $('excelFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      let rows;
      if (/\.(csv|txt)$/i.test(f.name)) rows = parseCsv(await f.text());
      else {
        let X;
        try { X = await loadXLSX(); } catch (err) { throw new Error(t('excelLibErr')); }
        const wb = X.read(await f.arrayBuffer(), { type: 'array' });
        rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
      }
      excelData = parseTeacherRows(rows);
      renderExcelPreview();
    } catch (err) { toast(err.message || t('importError'), true); }
  });

    let X;

    const wb = X.utils.book_new();

    X.utils.book_append_sheet(wb, ws, t('teachersSheet'));

  function renderPlan() {
    const subs = planSubjects();
    let h = `<tr><th>${t('subject')}</th>${GRADES.map(g => `<th>${g}</th>`).join('')}</tr>`;
    subs.forEach(s => {
      h += `<tr><td class="subj"><span class="dot" style="background:${D.SUBJECTS[s].color}"></span>${esc(subjName(s))}</td>`;
      GRADES.forEach(g => {
        const v = (state.plan[g] || {})[s];
        const txt = v === undefined ? '' : (Array.isArray(v) ? v.join(',') : v);
        h += `<td><input class="num plan-in" data-g="${g}" data-s="${s}" value="${txt}"></td>`;
      });
      h += '</tr>';
    });
    h += `<tr class="total"><td>${t('weeklyTotal')}</td>${GRADES.map(g => {
      const sum = Object.values(state.plan[g] || {}).reduce((a, v) => a + D.hoursFor(v, 0), 0);
      const over = sum > D.RULES.maxWeekly[g];
      return `<td class="${over ? 'bad' : ''}">${sum}</td>`;
    }).join('')}</tr>`;
    h += `<tr class="muted"><td>${t('maxWeekly')}</td>${GRADES.map(g => `<td>${D.RULES.maxWeekly[g]}</td>`).join('')}</tr>`;
    $('planTable').innerHTML = h;
    $('planTable').querySelectorAll('.plan-in').forEach(el => el.addEventListener('change', () => {
      const g = el.dataset.g, s = el.dataset.s, raw = el.value.trim();
      state.plan[g] = state.plan[g] || {};
      if (!raw || raw === '0') delete state.plan[g][s];
      else if (raw.includes(',')) state.plan[g][s] = raw.split(',').slice(0, 4).map(x => Number(x) || 0);
      else state.plan[g][s] = Number(raw) || 0;
      state.schedules = [null, null, null, null];
      save(); renderPlan();
    }));

    const weeks = [0, 1, 2, 3].map(weeksIn);
    let a = `<tr><th>${t('subject')}</th>${GRADES.map(g => `<th>${g}</th>`).join('')}</tr>`;
    const totals = GRADES.map(() => 0);
    subs.forEach(s => {
      a += `<tr><td class="subj">${esc(subjName(s))}</td>`;
      GRADES.forEach((g, gi) => {
        const v = (state.plan[g] || {})[s];
        if (v === undefined) { a += '<td></td>'; return; }
        const perQ = weeks.map((w, q) => D.hoursFor(v, q) * w);
        const sum = perQ.reduce((x, y) => x + y, 0);
        totals[gi] += sum;
        a += `<td title="${perQ.join(' + ')}"><b>${sum}</b><small>${perQ.join('/')}</small></td>`;
      });
      a += '</tr>';
    });
    a += `<tr class="total"><td>${t('total')}</td>${totals.map(x => `<td>${x}</td>`).join('')}</tr>`;
    $('annualTable').innerHTML = a;
  }

  // ================= 4. ЖҮКТЕМЕ =================
  function renderLoad() {
    const cls = classes();
    const subs = planSubjects();
    let h = `<tr><th>${t('classCol')}</th>${subs.map(s => `<th class="vert"><span>${esc(subjName(s))}</span></th>`).join('')}</tr>`;
    cls.forEach(c => {
      h += `<tr><td><b>${c.id}</b></td>`;
      subs.forEach(s => {
        const v = (state.plan[c.grade] || {})[s];
        if (v === undefined || D.avgHours(v) <= 0) { h += '<td class="na"></td>'; return; }
        const groups = (c.split && D.SUBJECTS[s].splittable) ? 2 : 1;
        const cur = ((state.assignments[c.id] || {})[s]) || [];
        let cell = '';
        for (let gi = 0; gi < groups; gi++) {
          const opts = state.teachers.filter(x => D.qualifies(x, s));
          cell += `<select class="as-sel ${cur[gi] ? '' : 'empty'}" data-c="${c.id}" data-s="${s}" data-gi="${gi}">

            ${opts.map(x => `<option value="${x.id}" ${cur[gi] === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
          </select>`;

      h += '</tr>';

      const a = state.assignments[el.dataset.c] = state.assignments[el.dataset.c] || {};
      const arr = a[el.dataset.s] = a[el.dataset.s] || [];
      arr[Number(el.dataset.gi)] = el.value;
      a[el.dataset.s] = Array.from(arr, x => x || '');

  function renderLoadTable() {
    const cls = classes();
    const load = Assign.computeLoad(cls, state.plan, state.teachers, cleanAssignments());
    let h = `<tr><th>${t('teacherName')}</th><th>${t('subject')}</th><th>${t('hours')}</th><th>${t('rate')}</th><th>${t('maxHours')}</th><th></th></tr>`;
    state.teachers.forEach(x => {
      const l = Math.round(load[x.id] * 10) / 10;
      const pct = Math.min(100, (l / (x.maxHours || 24)) * 100);
      const over = l > x.maxHours;
      h += `<tr><td><b>${esc(x.name)}</b></td><td>${x.subjects.map(subjName).map(esc).join(', ')}</td>
        <td class="${over ? 'bad' : ''}"><b>${l}</b></td><td>${(l / D.RULES.teacherRate).toFixed(2)}</td><td>${x.maxHours}</td>
        <td class="barcell"><div class="mini-bar ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div></td></tr>`;
    });
    $('loadTable').innerHTML = h;
  }

  function cleanAssignments() {
    const ids = new Set(state.teachers.map(x => x.id));
    const out = {};
    Object.keys(state.assignments).forEach(c => {
      out[c] = {};
      Object.keys(state.assignments[c]).forEach(s => { out[c][s] = (state.assignments[c][s] || []).filter(id => ids.has(id)); });
    });
    return out;
  }

  function cellHtml(x, q, cid, d, p, showClass) {
    if (!x) return `<td class="cell free" data-q="${q}" data-c="${cid}" data-d="${d}" data-p="${p}"></td>`;
    const col = (D.SUBJECTS[x.subj] || {}).color || '#888';

    const bad = (x.conflict || x.offDay) ? ' conflict' : '';
    return `<td class="cell${sel}${bad}" style="--c:${col}" data-q="${q}" data-c="${cid}" data-d="${d}" data-p="${p}">
