  function onCellClick(td) {
    const q = Number(td.dataset.q), c = td.dataset.c, d = Number(td.dataset.d), p = Number(td.dataset.p);
    if (!selectedCell || selectedCell.c !== c) { selectedCell = { c, d, p }; drawSchedule(); return; }
    if (selectedCell.d === d && selectedCell.p === p) { selectedCell = null; drawSchedule(); return; }
    const g = state.schedules[q].grid[c];
    const tmp = g[selectedCell.d][selectedCell.p];
    g[selectedCell.d][selectedCell.p] = g[d][p];
    g[d][p] = tmp;
    selectedCell = null;
    state.schedules[q].violations = Scheduler.validate(state.schedules[q].grid, teacherOffMap());
    save(); drawSchedule();
  }

  function renderStatus(sch) {
    const v = sch.violations || [];
    if (!v.length) { $('schStatus').innerHTML = `<div class="alert ok">${t('noConflicts')}</div>`; return; }
    const label = { teacher: t('vTeacher'), offday: t('vOffday'), triple: t('vTriple'), gap: t('vGap') };
    const items = v.slice(0, 12).map(x => `${esc(x.classId)} · ${dayName(x.day)}${x.period !== undefined ? ' · ' + (x.period + 1) : ''}${x.subj ? ' · ' + esc(subjName(x.subj)) : ''} — ${label[x.type]}`);
    $('schStatus').innerHTML = `<div class="alert warn"><b>${t('conflictsFound')}: ${v.length}</b><br>${items.join('<br>')}${v.length > 12 ? '<br>…' : ''}</div>`;
  }

  async function generateQuarter(q, label) {
    const cls = classes();
    const { lessons, missing } = Scheduler.buildLessons(cls, state.plan, cleanAssignments(), q);
    if (missing.length) {
      throw new Error(t('missingErr') + ': ' + [...new Set(missing.map(m => m.classId + ' ' + subjName(m.subj)))].slice(0, 8).join(', '));
    }
    const input = {
      days: state.days,
      classes: cls.map(c => ({ id: c.id, maxPerDay: D.RULES.maxPerDay[c.grade] })),
      lessons, teacherOff: teacherOffMap(), seed: 1000 + q * 7919
    };
    try {
      const res = await Scheduler.generate(input, (f, cost) => setProgress(f, label));
      state.schedules[q] = { grid: res.grid, days: res.days, periods: res.periods, violations: res.violations, created: new Date().toISOString() };
    } catch (e) {
      if (String(e.message).startsWith('CAPACITY')) {
        const [, cid, n, max] = e.message.split(':');
        throw new Error(`${t('capacityErr')}: ${cid} (${n} > ${max})`);
      }
      throw e;
    }
  }

  function setProgress(f, label) {
    $('progress').hidden = false;
    $('progressBar').style.width = Math.round(f * 100) + '%';
    $('progressText').textContent = (label || t('generating')) + ' ' + Math.round(f * 100) + '%';
  }

  async function runGenerate(qs) {
    if (!Object.keys(state.assignments).length) { toast(t('assignFirst'), true); return; }
    const btns = [$('btnGenerate'), $('btnGenerateAll')];
    btns.forEach(b => { b.disabled = true; });
    try {
      for (const q of qs) await generateQuarter(q, t('generating') + ' (' + ['I', 'II', 'III', 'IV'][q] + ')');
      save(); toast(t('saved'));
    } catch (e) {
      toast(e.message, true);
      $('schStatus').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`;
    } finally {
      btns.forEach(b => { b.disabled = false; });
      $('progress').hidden = true;
      drawSchedule();
    }
  }
  $('btnGenerate').addEventListener('click', () => runGenerate([Number($('schQuarter').value || 0)]));
  $('btnGenerateAll').addEventListener('click', () => runGenerate([0, 1, 2, 3]));
  $('btnPrint').addEventListener('click', () => window.print());

  $('btnCsv').addEventListener('click', () => {
    const q = Number($('schQuarter').value || 0);
    const sch = state.schedules[q];
    if (!sch) { toast(t('notGenerated'), true); return; }
    const cids = Object.keys(sch.grid);
    const rows = [[t('lesson'), t('period'), ...cids]];
    for (let d = 0; d < sch.days; d++) for (let p = 0; p < sch.periods; p++) {
      rows.push([dayName(d), p + 1, ...cids.map(c => {
        const x = sch.grid[c][d][p];
        return x ? subjName(x.subj) + ' (' + x.teachers.map(tName).join('/') + ')' : '';
      })]);
    }
    downloadCsv(`kesteh-${q + 1}-toqsan.csv`, rows);
  });

  function downloadCsv(name, rows) {
    const csv = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    download(name, '﻿' + csv, 'text/csv;charset=utf-8');
  }

  // ================= 6. ҚТЖ / ОМЖ =================
  function renderKtpControls() {
    fillQuarterSelect($('ktpQuarter'));
    const cur = $('ktpClass').value;
    $('ktpClass').innerHTML = classes().map(c => `<option>${c.id}</option>`).join('');
    if (cur && [...$('ktpClass').options].some(o => o.value === cur)) $('ktpClass').value = cur;
    fillKtpSubjects();
    drawKtp();
  }
  function fillKtpSubjects() {
    const c = classes().find(x => x.id === $('ktpClass').value);
    const cur = $('ktpSubject').value;
    const subs = c ? Object.keys(state.plan[c.grade] || {}) : [];
    $('ktpSubject').innerHTML = subs.map(s => `<option value="${s}">${esc(subjName(s))}</option>`).join('');
    if (cur && subs.includes(cur)) $('ktpSubject').value = cur;
  }
  $('ktpClass').addEventListener('change', () => { fillKtpSubjects(); drawKtp(); });
  ['ktpSubject', 'ktpQuarter', 'ktpType'].forEach(id => $(id).addEventListener('change', drawKtp));

  const ktpKey = () => [$('ktpClass').value, $('ktpSubject').value, $('ktpQuarter').value, $('ktpType').value].join('|');
  const ktpCtx = () => {
    const cid = $('ktpClass').value;
    const c = classes().find(x => x.id === cid);
    const subj = $('ktpSubject').value;
    const q = Number($('ktpQuarter').value || 0);
    const planned = c ? D.hoursFor((state.plan[c.grade] || {})[subj], q) * weeksIn(q) : 0;
    return { cid, c, subj, q, planned };
  };

  function computeKtpDates() {
    const { cid, subj, q, planned } = ktpCtx();
    const sch = state.schedules[q];
    if (!sch || !sch.grid[cid]) { toast(t('needSchedule'), true); return null; }
    const slots = {};
    sch.grid[cid].forEach((row, d) => row.forEach((x, p) => { if (x && x.subj === subj) (slots[d] = slots[d] || []).push(p); }));
    const rows = [];
    schoolDates(q).forEach(dt => (slots[weekday(dt)] || []).forEach(p => rows.push({ date: fmt(dt), period: p + 1, section: '', topic: '', objectives: '', type: '' })));
    const key = [cid, subj, q, 'ktp'].join('|');
    const old = (state.ktp[key] || {}).rows || [];
    rows.forEach((r, i) => { if (old[i]) Object.assign(r, { section: old[i].section, topic: old[i].topic, objectives: old[i].objectives, type: old[i].type }); });
    state.ktp[key] = { rows, planned };
    save();
    return state.ktp[key];
  }

  function drawKtp() {
    const type = $('ktpType').value;
    const { c, subj, q, planned } = ktpCtx();
    const data = state.ktp[ktpKey()];
    const title = c ? `${c.id} · ${esc(subjName(subj))} · ${['I', 'II', 'III', 'IV'][q]} ${t('quarter').toLowerCase()}` : '';
    $('btnDates').hidden = type !== 'ktp';
    if (!data || !data.rows || !data.rows.length) {
      $('ktpOut').innerHTML = `<h2 class="print-title">${title}</h2><p class="empty">${type === 'ktp' ? t('computeDates') : t('aiFill')} →</p>`;
      $('ktpStatus').innerHTML = '';
      return;
    }
    let h = `<h2 class="print-title">${type === 'ktp' ? t('ktp') : t('omj')}: ${title}</h2>`;
    if (type === 'ktp') {
      $('ktpStatus').innerHTML = `<div class="alert ${data.rows.length === planned ? 'ok' : 'warn'}">${t('planned')}: <b>${planned}</b> · ${t('actual')}: <b>${data.rows.length}</b></div>`;
      h += `<div class="scroll"><table class="tbl ktp"><tr><th>№</th><th>${t('date')}</th><th>${t('section')}</th><th>${t('topic')}</th><th>${t('objectives')}</th><th>${t('type')}</th></tr>`;
      data.rows.forEach((r, i) => {
        h += `<tr><td>${i + 1}</td><td class="nowrap">${r.date}<small> · ${r.period}</small></td>
          ${['section', 'topic', 'objectives', 'type'].map(k => `<td contenteditable="true" data-i="${i}" data-k="${k}">${esc(r[k])}</td>`).join('')}</tr>`;
      });
      h += '</table></div>';
    } else {
      $('ktpStatus').innerHTML = `<div class="alert ok">${t('hoursCol')}: <b>${planned}</b></div>`;
      h += `<div class="scroll"><table class="tbl ktp"><tr><th>${t('section')}</th><th>${t('hoursCol')}</th><th>${t('topicsCol')}</th><th>${t('objectives')}</th><th>${t('results')}</th><th>${t('assessment')}</th></tr>`;
      data.rows.forEach((r, i) => {
        h += `<tr>${['section', 'hours', 'topics', 'objectives', 'results', 'assessment'].map(k => {
          const v = Array.isArray(r[k]) ? r[k].join('\n') : r[k];
          return `<td contenteditable="true" data-i="${i}" data-k="${k}" class="pre">${esc(v)}</td>`;
        }).join('')}</tr>`;
      });
      h += '</table></div>';
    }
    $('ktpOut').innerHTML = h;
    $('ktpOut').querySelectorAll('[contenteditable]').forEach(td => td.addEventListener('blur', () => {
      data.rows[td.dataset.i][td.dataset.k] = td.innerText.trim(); save();
    }));
  }

  $('btnDates').addEventListener('click', () => { if (computeKtpDates()) drawKtp(); });

  $('btnAiFill').addEventListener('click', async () => {
    if (!AI.settings().apiKey) { toast(t('aiNoKey'), true); openSettings(); return; }
    const type = $('ktpType').value;
    const { c, subj, q, planned } = ktpCtx();
    if (!c || !subj) return;
    const btn = $('btnAiFill'); btn.disabled = true;
    $('ktpStatus').innerHTML = `<div class="alert"><span class="spinner"></span> ${t('aiWorking')}</div>`;
    try {
      if (type === 'ktp') {
        const data = state.ktp[ktpKey()] && state.ktp[ktpKey()].rows.length ? state.ktp[ktpKey()] : computeKtpDates();
        if (!data) return;
        const items = await AI.generateKTP({ subject: D.SUBJECTS[subj].kk + ' / ' + D.SUBJECTS[subj].en, grade: c.grade, quarter: q + 1, count: data.rows.length, lang: I18N.lang });
        data.rows.forEach((r, i) => {
          const it = items[i] || {};
          r.section = it.section || r.section; r.topic = it.topic || r.topic;
          r.objectives = it.objectives || r.objectives; r.type = it.type && it.type !== 'lesson' ? it.type : '';
        });
      } else {
        const items = await AI.generateOMJ({ subject: D.SUBJECTS[subj].kk + ' / ' + D.SUBJECTS[subj].en, grade: c.grade, quarter: q + 1, hours: planned, lang: I18N.lang });
        state.ktp[ktpKey()] = { rows: items, planned };
      }
      save(); drawKtp();
    } catch (e) {
      $('ktpStatus').innerHTML = `<div class="alert bad">${t('error')}: ${esc(e.message === 'NO_KEY' ? t('aiNoKey') : e.message)}</div>`;
    } finally { btn.disabled = false; }
  });

  $('btnKtpCsv').addEventListener('click', () => {
    const data = state.ktp[ktpKey()];
    if (!data) return;
    const type = $('ktpType').value;
    const rows = type === 'ktp'
      ? [['№', t('date'), t('section'), t('topic'), t('objectives'), t('type')], ...data.rows.map((r, i) => [i + 1, r.date, r.section, r.topic, r.objectives, r.type])]
      : [[t('section'), t('hoursCol'), t('topicsCol'), t('objectives'), t('results'), t('assessment')],
         ...data.rows.map(r => ['section', 'hours', 'topics', 'objectives', 'results', 'assessment'].map(k => Array.isArray(r[k]) ? r[k].join('; ') : r[k]))];
    downloadCsv(`${type}-${ktpKey().replace(/\|/g, '-')}.csv`, rows);
  });
  $('btnKtpPrint').addEventListener('click', () => window.print());

  // ================= 7. AI =================
  function renderAiControls() { fillQuarterSelect($('aiQuarter')); }

  function scheduleSummary(q) {
    const sch = state.schedules[q];
    if (!sch) return null;
    const cls = classes();
    const load = Assign.computeLoad(cls, state.plan, state.teachers, cleanAssignments());
    let s = `School timetable, quarter ${q + 1}, ${state.days}-day week. Grades 5–11, Kazakhstan.\n\n`;
    Object.keys(sch.grid).forEach(cid => {
      s += `Class ${cid}:\n`;
      sch.grid[cid].forEach((row, d) => {
        s += `  ${D.DAYS.en[d]}: ` + row.filter(Boolean).map(x => D.SUBJECTS[x.subj].en + ' [' + x.teachers.map(tName).join('/') + ']').join(', ') + '\n';
      });
    });
    s += '\nTeacher weekly load (hours; max):\n' + state.teachers.map(x => `  ${x.name}: ${load[x.id]} / ${x.maxHours}`).join('\n');
    s += `\n\nDetected hard violations: ${(sch.violations || []).length}`;
    return s;
  }

  $('btnAnalyze').addEventListener('click', async () => {
    if (!AI.settings().apiKey) { toast(t('aiNoKey'), true); openSettings(); return; }
    const q = Number($('aiQuarter').value || 0);
    const summary = scheduleSummary(q);
    if (!summary) { toast(t('needSchedule'), true); return; }
    const out = $('aiAnalysis');
    out.innerHTML = `<span class="spinner"></span> ${t('aiWorking')}`;
    try { out.innerHTML = md(await AI.analyzeSchedule(summary, I18N.lang)); }
    catch (e) { out.innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; }
  });

  const chatHistory = [];
  function chatContext() {
    const cls = classes();
    const load = Assign.computeLoad(cls, state.plan, state.teachers, cleanAssignments());
    let s = `Classes: ${cls.map(c => c.id).join(', ')}. Week: ${state.days} days.\n`;
    s += 'Teachers: ' + state.teachers.map(x => `${x.name} (${x.subjects.map(sb => D.SUBJECTS[sb].en).join('/')}, ${load[x.id]}h)`).join('; ') + '\n';
    s += 'Weekly curriculum: ' + GRADES.map(g => g + ': ' + Object.entries(state.plan[g] || {}).map(([k, v]) => D.SUBJECTS[k].en + ' ' + (Array.isArray(v) ? v.join('/') : v)).join(', ')).join(' | ');
    const q = Number($('aiQuarter').value || 0);
    const sum = scheduleSummary(q);
    if (sum) s += '\n\n' + sum;
    return s;
  }
  function drawChat() {
    $('chatLog').innerHTML = chatHistory.map(m => `<div class="msg ${m.role}">${m.role === 'assistant' ? md(m.content) : esc(m.content)}</div>`).join('');
    $('chatLog').scrollTop = $('chatLog').scrollHeight;
  }
  async function sendChat() {
    const text = $('chatInput').value.trim();
    if (!text) return;
    if (!AI.settings().apiKey) { toast(t('aiNoKey'), true); openSettings(); return; }
    chatHistory.push({ role: 'user', content: text });
    $('chatInput').value = ''; drawChat();
    $('chatLog').insertAdjacentHTML('beforeend', `<div class="msg assistant typing"><span class="spinner"></span></div>`);
    try {
      const reply = await AI.chat(chatHistory.slice(-12), chatContext(), I18N.lang);
      chatHistory.push({ role: 'assistant', content: reply });
    } catch (e) {
      chatHistory.pop();
      toast(e.message, true);
    }
    drawChat();
  }
  $('btnSend').addEventListener('click', sendChat);
  $('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });

  // Қарапайым markdown → HTML
  function md(src) {
    const lines = esc(src).split('\n');
    let html = '', inList = false;
    lines.forEach(line => {
      const l = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
      if (/^\s*[-*•]\s+/.test(line)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + l.replace(/^\s*[-*•]\s+/, '') + '</li>';
        return;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (/^#{1,6}\s/.test(line)) html += '<h4>' + l.replace(/^#{1,6}\s/, '') + '</h4>';
      else if (l.trim()) html += '<p>' + l + '</p>';
    });
    if (inList) html += '</ul>';
    return html;
  }

  // ================= БАПТАУЛАР =================
  let dlgSettings = null;
  function fillSettingsFields() {
    const prov = $('aiProvider').value;
    const isG = prov === 'gemini';
    $('apiKeyLabel').textContent = isG ? t('geminiKey') : t('apiKey');
    $('apiKeyHint').textContent = isG ? t('geminiHint') : t('apiKeyHint');
    $('apiKey').placeholder = isG ? 'AIza...' : 'sk-ant-...';
    $('apiKey').value = dlgSettings.keys[prov] || '';
    $('aiModel').value = dlgSettings.models[prov] || AI.DEFAULTS[prov];
  }
  function openSettings() {
    dlgSettings = JSON.parse(JSON.stringify(AI.settings().all));
    $('aiProvider').value = dlgSettings.provider;
    $('aiProvider').dataset.prev = dlgSettings.provider;
    fillSettingsFields();
    $('settingsDlg').showModal();
  }
  function keepFields(prov) {
    dlgSettings.keys[prov] = $('apiKey').value.trim();
    dlgSettings.models[prov] = $('aiModel').value.trim() || AI.DEFAULTS[prov];
  }
  $('aiProvider').addEventListener('change', () => {
    keepFields($('aiProvider').dataset.prev);
    $('aiProvider').dataset.prev = $('aiProvider').value;
    fillSettingsFields();
  });
  $('btnSettings').addEventListener('click', openSettings);
  $('btnSaveSettings').addEventListener('click', () => {
    keepFields($('aiProvider').value);
    dlgSettings.provider = $('aiProvider').value;
    AI.saveSettings(dlgSettings);
    toast(t('saved'));
  });

  // ================= БАСТАУ =================
  applyLang();
};

</script>
  <script>
/* =========================================================
   auth.js — Аккаунттар және деректерді сақтау
   Екі режим:
   • ☁ Firebase (firebase-config.js толтырылса) — аккаунттар
     Firebase Authentication-да, деректер Cloud Firestore-да.
     Кез келген компьютерден кіруге болады.
   • 💾 Жергілікті (конфиг бос болса) — бәрі осы браузерде.
   Әкімші пайдаланушыларды тіркейді, бұғаттайды, рөлін өзгертеді
   және олардың деректерін аша алады.
   ========================================================= */
(function (g) {
  'use strict';
  const t = k => I18N.t(k);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const wrap = store => ({
    get(k) { try { return store().getItem(k); } catch (e) { return null; } },
    set(k, v) { try { store().setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { store().removeItem(k); } catch (e) { /* бос */ } }
  });
  const ls = wrap(() => localStorage), ss = wrap(() => sessionStorage);
  const VIEW = 'sss_view_as';
  const stateKey = id => 'sss_state_v1:' + id;
  const aiKey = id => 'sss_ai:' + id;
  const nowIso = () => new Date().toISOString();

  class AuthError extends Error { constructor(code, detail) { super(code); this.code = code; this.detail = detail || ''; } }
  const fail = (code, detail) => { throw new AuthError(code, detail); };
  const errText = e => (e && e.code && I18N.t(e.code) !== e.code ? t(e.code) : t('errServer')) + (e && e.detail ? ' (' + e.detail + ')' : '');

  // ---------- Конфиг ----------
  const RAW = g.FIREBASE_CONFIG || {};
  const CFG = RAW.apiKey && RAW.projectId ? RAW : null;
  const LOGIN_DOMAIN = (RAW.loginDomain || 'eduschedule.local').toLowerCase();
  const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  const validLogin = s => /^[A-Za-z0-9._-]{3,32}$/.test(s) || isEmail(s);
  const loginToEmail = s => (s.includes('@') ? s : s + '@' + LOGIN_DOMAIN).toLowerCase();

  // ---------- SHA-256 (жергілікті режимге) ----------
  const sha256 = (function () {
    const K = [], H0 = [];
    let n = 2, found = 0;
    const frac = x => ((x - Math.floor(x)) * 4294967296) | 0;
    while (found < 64) {
      let prime = true;
      for (let f = 2; f * f <= n; f++) if (n % f === 0) { prime = false; break; }
      if (prime) { if (found < 8) H0[found] = frac(Math.pow(n, 1 / 2)); K[found] = frac(Math.pow(n, 1 / 3)); found++; }
      n++;
    }
    const ror = (x, r) => (x >>> r) | (x << (32 - r));
    return function (str) {
      const bytes = new TextEncoder().encode(str);
      const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
      const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
      const dv = new DataView(m.buffer);
      dv.setUint32(total - 4, (len * 8) >>> 0);
      dv.setUint32(total - 8, Math.floor(len / 536870912));
      const h = H0.slice(), w = new Int32Array(64);
      for (let i = 0; i < total; i += 64) {
        for (let j = 0; j < 16; j++) w[j] = dv.getInt32(i + j * 4);
        for (let j = 16; j < 64; j++) {
          const x = w[j - 15], y = w[j - 2];
          w[j] = (w[j - 16] + (ror(x, 7) ^ ror(x, 18) ^ (x >>> 3)) + w[j - 7] + (ror(y, 17) ^ ror(y, 19) ^ (y >>> 10))) | 0;
        }
        let [a, b, c, d, e, f, gg, hh] = h;
        for (let j = 0; j < 64; j++) {
          const t1 = (hh + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & gg)) + K[j] + w[j]) | 0;
          const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
          hh = gg; gg = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        [a, b, c, d, e, f, gg, hh].forEach((v, k) => { h[k] = (h[k] + v) | 0; });
      }
      return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
    };
  })();
  const randHex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
  function randomPassword() {
    const abc = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from(crypto.getRandomValues(new Uint8Array(8)), b => abc[b % abc.length]).join('');
  }
  function newProfile(d) {
    const login = d.login.trim();
    return { name: d.name.trim(), login, email: loginToEmail(login), role: d.role === 'admin' ? 'admin' : 'user',
             active: true, created: nowIso(), lastLogin: null, summary: null };
  }

  // =========================================================
  // 💾 Жергілікті режим (localStorage)
  // =========================================================
  function LocalBackend() {
    const USERS = 'sss_users', SESSION = 'sss_session';
    const users = () => { try { return JSON.parse(ls.get(USERS) || '[]'); } catch (e) { return []; } };
    const saveUsers = list => ls.set(USERS, JSON.stringify(list));
    const hashPw = (pw, salt) => { let h = sha256(salt + '|' + pw); for (let i = 0; i < 999; i++) h = sha256(h + salt); return h; };
    const pub = u => { const { salt, hash, ...rest } = u; return rest; };
    let me = null;
    function setPw(u, pw) { u.salt = randHex(16); u.hash = hashPw(pw, u.salt); }

    return {
      mode: 'local', canSetPassword: true,
      async init() {
        const id = ss.get(SESSION) || ls.get(SESSION);
        const u = users().find(x => x.id === id && x.active !== false);
        me = u ? pub(u) : null;
        return me;
      },
      async needsSetup() { return !users().some(u => u.role === 'admin' && u.active !== false); },
      async signIn(login, pw, remember) {
        const list = users();
        const u = list.find(x => x.login.toLowerCase() === login.toLowerCase());
        if (!u || u.hash !== hashPw(pw, u.salt)) fail('authWrong');
        if (u.active === false) fail('authBlocked');
        u.lastLogin = nowIso(); saveUsers(list);
        ss.set(SESSION, u.id);
        if (remember) ls.set(SESSION, u.id); else ls.del(SESSION);
        me = pub(u);
        return me;
      },
      async signOut() { ss.del(SESSION); ls.del(SESSION); me = null; },
      async setupAdmin(d, remember) {
        const id = await this.createUser(Object.assign({}, d, { role: 'admin' }));
        // аккаунттарға дейінгі ескі деректер — алғашқы әкімшіге
        [['sss_state_v1', stateKey(id)], ['sss_ai', aiKey(id)]].forEach(([from, to]) => {
          const v = ls.get(from);
          if (v && !ls.get(to)) { ls.set(to, v); ls.del(from); }
        });
        return this.signIn(d.login, d.password, remember);
      },
      async listUsers() { return users().map(pub); },
      async getUser(id) { const u = users().find(x => x.id === id); return u ? pub(u) : null; },
      async createUser(d) {
        const list = users();
        if (list.some(u => u.login.toLowerCase() === d.login.toLowerCase())) fail('errExists');
        const u = Object.assign({ id: 'u' + Date.now().toString(36) + randHex(3) }, newProfile(d));
        setPw(u, d.password);
        list.push(u); saveUsers(list);
        return u.id;
      },
      async updateUser(id, patch) {
        const list = users(), u = list.find(x => x.id === id);
        if (u) { Object.assign(u, patch); saveUsers(list); }
      },
      async deleteUser(id) {
        saveUsers(users().filter(x => x.id !== id));
        ls.del(stateKey(id)); ls.del(aiKey(id));
      },
      async changeOwnPassword(oldPw, newPw) {
        const list = users(), u = list.find(x => me && x.id === me.id);
        if (!u || u.hash !== hashPw(oldPw, u.salt)) fail('errOldPwd');
        setPw(u, newPw); saveUsers(list);
      },
      async setPassword(id, pw) {
        const list = users(), u = list.find(x => x.id === id);
        if (u) { setPw(u, pw); saveUsers(list); }
      },
      async loadState(id) { return ls.get(stateKey(id)); },
      async saveState(id, json, summary) {
        if (!ls.set(stateKey(id), json)) fail('errQuota');
        const list = users(), u = list.find(x => x.id === id);
        if (u) { u.summary = summary; saveUsers(list); }
      }
    };
  }

  // =========================================================
  // ☁ Firebase режимі (Authentication + Cloud Firestore)
  // =========================================================
  function FirebaseBackend(rawCfg) {
    const SDK = 'https://www.gstatic.com/firebasejs/13.4.0/';
    const cfg = Object.assign({}, rawCfg); delete cfg.loginDomain;
    const CHUNK = 300000; // Firestore құжаты ≤ 1 МБ, сондықтан деректер бөліктерге бөлінеді
    let A, AU, F, app, auth, db, me = null;
    const chunkCount = {};

    function mapErr(e) {
      if (e instanceof AuthError) return e;
      const c = (e && e.code) || '';
      if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return new AuthError('authWrong');
      if (/email-already-in-use/.test(c)) return new AuthError('errExists');
      if (/weak-password/.test(c)) return new AuthError('errPass');
      if (/too-many-requests/.test(c)) return new AuthError('errTooMany');
      if (/network-request-failed|unavailable|deadline-exceeded/.test(c)) return new AuthError('errNetwork');
      if (/permission-denied|insufficient-permission/.test(c)) return new AuthError('errPermission');
      if (/operation-not-allowed/.test(c)) return new AuthError('errProvider');
      if (/api-key|invalid-api-key|configuration-not-found|project/.test(c)) return new AuthError('errConfig', c);
      return new AuthError('errServer', c || (e && e.message) || '');
    }
    const safe = fn => async (...args) => { try { return await fn(...args); } catch (e) { throw mapErr(e); } };

    const uref = id => F.doc(db, 'users', id);
    const sref = id => F.doc(db, 'states', id);
    const cref = (id, i) => F.doc(db, 'states', id, 'chunks', String(i));

    async function profile(uid) {
      const s = await F.getDoc(uref(uid));
      return s.exists() ? Object.assign({ id: uid }, s.data()) : null;
    }
    async function requireProfile(user) {
      const p = await profile(user.uid);
      if (!p || p.active !== true) { await AU.signOut(auth); fail(p ? 'authBlocked' : 'authNoProfile'); }
      me = p;
      return p;
    }
    function splitJson(json) {
      const parts = [];
      let i = 0;
      while (i < json.length) {
        let end = Math.min(json.length, i + CHUNK);
        const code = json.charCodeAt(end - 1);
        if (end < json.length && code >= 0xD800 && code <= 0xDBFF) end--; // эмодзиді екіге бөлмеу
        parts.push(json.slice(i, end)); i = end;
      }
      return parts;
    }

    const api = {
      mode: 'firebase', canSetPassword: false,
      async init() {
        try {
          [A, AU, F] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(SDK + f)));
        } catch (e) { fail('errSdk'); }
        app = A.initializeApp(cfg);
        auth = AU.getAuth(app);
        try {
          db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
        } catch (e) { db = F.getFirestore(app); }
        const user = await new Promise(res => { const off = AU.onAuthStateChanged(auth, u => { off(); res(u); }); });
        if (!user) return null;
        try { return await requireProfile(user); } catch (e) { return null; }
      },
      async needsSetup() { return !(await F.getDoc(F.doc(db, 'meta', 'setup'))).exists(); },
      async signIn(login, pw, remember) {
        await AU.setPersistence(auth, remember ? AU.browserLocalPersistence : AU.browserSessionPersistence);
        const c = await AU.signInWithEmailAndPassword(auth, loginToEmail(login), pw);
        const p = await requireProfile(c.user);
        F.updateDoc(uref(p.id), { lastLogin: nowIso() }).catch(() => {});
        return p;
      },
      async signOut() { me = null; await AU.signOut(auth); },
      async setupAdmin(d, remember) {
        if (!(await api.needsSetup())) fail('errSetupDone');
        await AU.setPersistence(auth, remember ? AU.browserLocalPersistence : AU.browserSessionPersistence);
        const c = await AU.createUserWithEmailAndPassword(auth, loginToEmail(d.login), d.password);
        const uid = c.user.uid;
        const p = newProfile(Object.assign({}, d, { role: 'admin' }));
        p.lastLogin = nowIso();
        const b = F.writeBatch(db);
        b.set(F.doc(db, 'meta', 'setup'), { admin: uid, at: nowIso() });
        b.set(uref(uid), p);
        try { await b.commit(); } catch (e) { await c.user.delete().catch(() => {}); throw e; }
        me = Object.assign({ id: uid }, p);
        const legacy = ls.get('sss_state_v1'); // серверге дейінгі деректер болса — бұлтқа көшіру
        if (legacy) { try { await api.saveState(uid, legacy, null); ls.del('sss_state_v1'); } catch (e) { /* бос */ } }
        return me;
      },
      async listUsers() {
        const q = await F.getDocs(F.collection(db, 'users'));
        return q.docs.map(d => Object.assign({ id: d.id }, d.data()))
          .sort((a, b) => String(a.created).localeCompare(String(b.created)));
      },
      getUser: profile,
      async createUser(d) {
        // Әкімші шығып кетпеуі үшін жаңа аккаунт бөлек (екінші) Firebase данасында құрылады
        const sec = A.initializeApp(cfg, 'reg-' + Date.now());
        try {
          const sa = AU.initializeAuth(sec, { persistence: AU.inMemoryPersistence });
          const c = await AU.createUserWithEmailAndPassword(sa, loginToEmail(d.login), d.password);
          const uid = c.user.uid;
          await AU.signOut(sa);
          await F.setDoc(uref(uid), newProfile(d));
          return uid;
        } finally { A.deleteApp(sec).catch(() => {}); }
      },
      async updateUser(id, patch) { await F.updateDoc(uref(id), patch); },
      async deleteUser(id) {
        const st = await F.getDoc(sref(id));
        const b = F.writeBatch(db);
        const n = st.exists() ? (st.data().chunks || 0) : 0;
        for (let i = 0; i < n; i++) b.delete(cref(id, i));
        if (st.exists()) b.delete(sref(id));
        b.delete(uref(id));
        await b.commit();
        ls.del(aiKey(id));
      },
      async changeOwnPassword(oldPw, newPw) {
        const u = auth.currentUser;
        try { await AU.reauthenticateWithCredential(u, AU.EmailAuthProvider.credential(u.email, oldPw)); }
        catch (e) { const m = mapErr(e); throw m.code === 'authWrong' ? new AuthError('errOldPwd') : m; }
        await AU.updatePassword(u, newPw);
      },
      async resetPassword(u) {
        if (!u.email || u.email.endsWith('@' + LOGIN_DOMAIN)) fail('resetUnsupported');
        await AU.sendPasswordResetEmail(auth, u.email);
        return u.email;
      },
      async loadState(id) {
        const s = await F.getDoc(sref(id));
        if (!s.exists()) { chunkCount[id] = 0; return null; }
        const n = s.data().chunks || 0;
        const parts = await Promise.all([...Array(n).keys()].map(i => F.getDoc(cref(id, i))));
        if (parts.some(p => !p.exists())) fail('errLoad', 'chunks');
        chunkCount[id] = n;
        return parts.map(p => p.data().d).join('');
      },
      async saveState(id, json, summary) {
        const parts = splitJson(json);
        let prev = chunkCount[id];
        if (prev === undefined) { const s = await F.getDoc(sref(id)); prev = s.exists() ? (s.data().chunks || 0) : 0; }
        const b = F.writeBatch(db);
        parts.forEach((d, i) => b.set(cref(id, i), { d }));
        for (let i = parts.length; i < prev; i++) b.delete(cref(id, i));
        b.set(sref(id), { chunks: parts.length, updated: nowIso(), by: me ? me.id : '', summary: summary || null });
        b.update(uref(id), { summary: summary || null });
        await b.commit();
        chunkCount[id] = parts.length;
      }
    };
    Object.keys(api).forEach(k => { if (typeof api[k] === 'function') api[k] = safe(api[k]); });
    return api;
  }

  const B = CFG ? FirebaseBackend(CFG) : LocalBackend();

  // =========================================================
  // Интерфейс
  // =========================================================
  let me = null, viewUser = null, started = false, initialJson = null, mode = 'login', lastList = [];

  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = 'toast'; }, 4500);
  }
  const initials = name => String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  function fmtDate(isoStr) {
    if (!isoStr) return t('never');
    const d = new Date(isoStr), p = x => String(x).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  const dataId = () => (viewUser ? viewUser.id : me ? me.id : 'guest');
  function summarize(s) {
    if (!s) return null;
    return {
      teachers: (s.teachers || []).length,
      classes: Object.values(s.grades || {}).reduce((a, x) => a + (Number(x.count) || 0), 0),
      schedules: (s.schedules || []).filter(Boolean).length
    };
  }
  async function busy(btn, fn) {
    btn.disabled = true;
    try { return await fn(); } finally { btn.disabled = false; }
  }

  // ---------- Кіру беті ----------
  function setBoot(text, withRetry) {
    $('authBoot').hidden = !text;
    $('authForm').hidden = !!text;
    $('authBoot').innerHTML = text ? `<div class="alert ${withRetry ? 'bad' : ''}">${withRetry ? '' : '<span class="spinner"></span> '}${esc(text)}</div>
      ${withRetry ? `<div class="btn-row"><button class="btn primary" type="button" id="btnRetry">${t('retry')}</button>
      ${me ? `<button class="btn" type="button" id="btnBootOut">${t('logout')}</button>` : ''}</div>` : ''}` : '';
    if (withRetry) {
      $('btnRetry').addEventListener('click', () => location.reload());
      if (me) $('btnBootOut').addEventListener('click', logout);
    }
  }
  function paintAuth() {
    I18N.apply($('authScreen'));
    document.querySelectorAll('#authScreen .lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === I18N.lang));
    const setup = mode === 'setup';
    $('authTitle').textContent = t(setup ? 'setupTitle' : 'loginTitle');
    $('authHint').textContent = t(setup ? 'setupHint' : 'loginHint');
    $('fName').hidden = !setup;
    $('fPass2').hidden = !setup;
    $('authSubmit').textContent = t(setup ? 'createAdmin' : 'signIn');
    $('authFoot').innerHTML = `<span class="pill ${B.mode === 'firebase' ? 'ok' : 'warn'}">${t(B.mode === 'firebase' ? 'modeCloud' : 'modeLocal')}</span><br>${t(B.mode === 'firebase' ? 'authFootCloud' : 'authFootLocal')}`;
  }
  function showAuthScreen() {
    document.body.classList.add('locked');
    $('authScreen').hidden = false;
    paintAuth();
  }
  async function showLogin() {
    showAuthScreen();
    setBoot(t('loading'));
    try { mode = (await B.needsSetup()) ? 'setup' : 'login'; }
    catch (e) { mode = 'login'; }
    setBoot('');
    paintAuth();
    setTimeout(() => (mode === 'setup' ? $('aName') : $('aLogin')).focus(), 50);
  }

  async function enter() {
    showAuthScreen();
    setBoot(t('loadingData'));
    viewUser = null;
    const vid = ss.get(VIEW);
    if (vid && me.role === 'admin' && vid !== me.id) {
      try { viewUser = await B.getUser(vid); } catch (e) { viewUser = null; }
      if (!viewUser) ss.del(VIEW);
    }
    try { initialJson = await B.loadState(dataId()); }
    catch (e) { setBoot(t('errLoad') + ' ' + errText(e), true); return; } // деректерді бұзып алмау үшін тоқтаймыз
    $('authScreen').hidden = true;
    document.body.classList.remove('locked');
    paintChrome();
    setSync(B.mode === 'firebase' ? 'ok' : 'local');
    if (!started) { started = true; g.startApp(); }
  }

  $('authForm').addEventListener('submit', e => {
    e.preventDefault();
    const err = msg => { $('authErr').textContent = msg; $('authErr').hidden = false; };
    const login = $('aLogin').value.trim(), pw = $('aPass').value, remember = $('aRemember').checked;
    $('authErr').hidden = true;
    busy($('authSubmit'), async () => {
      try {
        if (mode === 'setup') {
          const name = $('aName').value.trim();
          if (!name) return err(t('errName'));
          if (!validLogin(login)) return err(t('errLogin'));
          if (pw.length < 6) return err(t('errPass'));
          if (pw !== $('aPass2').value) return err(t('errPass2'));
          me = await B.setupAdmin({ name, login, password: pw }, remember);
        } else {
          if (!login || !pw) return err(t('authWrong'));
          me = await B.signIn(login, pw, remember);
        }
        $('aPass').value = ''; $('aPass2').value = '';
        await enter();
      } catch (ex) { err(errText(ex)); }
    });
  });
  document.querySelectorAll('#authScreen .lang-switch button').forEach(b => b.addEventListener('click', () => {
    I18N.setLang(b.dataset.lang); paintAuth();
  }));

  // ---------- Деректерді сақтау (бұлтқа / браузерге) ----------
  let pending = null, inflight = null, timer = null;
  function setSync(st, e) {
    const el = $('syncStatus');
    el.className = 'sync ' + st;
    el.textContent = { local: '💾 ' + t('syncLocal'), ok: '☁ ' + t('syncOk'), saving: '⟳ ' + t('syncSaving'), error: '⚠ ' + t('syncError') }[st];
    el.title = st === 'error' ? errText(e) + ' — ' + t('syncRetry') : '';
  }
  function persist(stateObj) {
    pending = { json: JSON.stringify(stateObj), summary: summarize(stateObj) };
    if (B.mode === 'local') { flush(); return; }
    setSync('saving');
    clearTimeout(timer);
    timer = setTimeout(flush, 1200);
  }
  function flush() {
    clearTimeout(timer);
    if (inflight) return inflight.then(() => (pending ? flush() : null));
    if (!pending) return Promise.resolve();
    const job = pending; pending = null;
    inflight = B.saveState(dataId(), job.json, job.summary)
      .then(() => { if (!pending) setSync(B.mode === 'firebase' ? 'ok' : 'local'); })
      .catch(e => { if (!pending) pending = job; setSync('error', e); toast(t('syncError') + ': ' + errText(e), true); })
      .finally(() => { inflight = null; });
    return inflight;
  }
  $('syncStatus').addEventListener('click', () => { if (pending) { setSync('saving'); flush(); } });
  window.addEventListener('beforeunload', e => {
    if (pending || inflight) { flush(); e.preventDefault(); e.returnValue = ''; }
  });

  async function logout() {
    try { await flush(); } catch (e) { /* бос */ }
    if (pending && !confirm(t('confirmUnsaved'))) return;
    pending = null;
    ss.del(VIEW);
    try { await B.signOut(); } catch (e) { /* бос */ }
    location.reload();
  }
  function switchData(id) {
    const go = () => { if (id && id !== me.id) ss.set(VIEW, id); else ss.del(VIEW); location.reload(); };
    flush().then(go, go);
  }

  // ---------- Жоғарғы панель ----------
  function paintChrome() {
    if (!me) return;
    $('userName').textContent = me.name;
    $('userRole').textContent = t(me.role === 'admin' ? 'roleAdmin' : 'roleUser');
    $('userAvatar').textContent = initials(me.name);
    $('tabUsersBtn').hidden = me.role !== 'admin';
    const bar = $('viewAsBar');
    if (viewUser) {
      bar.hidden = false;
      bar.innerHTML = `<span>👁 ${t('viewingAs')} <b>${esc(viewUser.name)}</b> (${esc(viewUser.login)})</span><span class="spacer"></span>
        <button class="btn sm" id="btnBackMine">${t('backToMine')}</button>`;
      $('btnBackMine').addEventListener('click', () => switchData(null));
    } else bar.hidden = true;
  }
  $('btnLogout').addEventListener('click', logout);
  $('btnPassword').addEventListener('click', () => { if (me) openPwd(me, true); });

  // ---------- Құпиясөз диалогы ----------
  let pwdTarget = null, pwdSelf = false;
  function openPwd(u, self) {
    pwdTarget = u.id; pwdSelf = self;
    $('pwdFor').textContent = `${u.name} · ${u.login}`;
    $('pwdOldWrap').hidden = !self;
    $('pwdOld').value = ''; $('pwdNew').value = self ? '' : randomPassword();
    $('pwdNew').type = self ? 'password' : 'text';
    $('pwdErr').hidden = true;
    $('pwdDlg').showModal();
  }
  $('pwdCancel').addEventListener('click', () => $('pwdDlg').close());
  $('pwdForm').addEventListener('submit', e => {
    e.preventDefault();
    const failMsg = m => { $('pwdErr').textContent = m; $('pwdErr').hidden = false; };
    const np = $('pwdNew').value;
    if (np.length < 6) return failMsg(t('errPass'));
    busy($('pwdSave'), async () => {
      try {
        if (pwdSelf) await B.changeOwnPassword($('pwdOld').value, np);
        else await B.setPassword(pwdTarget, np);
        $('pwdDlg').close();
        toast(t('pwdChanged') + (pwdSelf ? '' : ': ' + np));
      } catch (ex) { failMsg(errText(ex)); }
    });
  });

  // ---------- Пайдаланушылар беті (тек әкімшіге) ----------
  const activeAdmins = list => list.filter(u => u.role === 'admin' && u.active !== false);
  async function renderUsers() {
    if (!me || me.role !== 'admin') return;
    const roleOpts = sel => ['user', 'admin'].map(r => `<option value="${r}" ${sel === r ? 'selected' : ''}>${t(r === 'admin' ? 'roleAdmin' : 'roleUser')}</option>`).join('');
    $('uRole').innerHTML = roleOpts($('uRole').value || 'user');
    $('usersMode').innerHTML = `<span class="pill ${B.mode === 'firebase' ? 'ok' : 'warn'}">${t(B.mode === 'firebase' ? 'modeCloud' : 'modeLocal')}</span>`;
    if (!lastList.length) $('userTable').innerHTML = `<tr><td class="empty"><span class="spinner"></span></td></tr>`;
    try { lastList = await B.listUsers(); }
    catch (e) { $('userTable').innerHTML = `<tr><td><div class="alert bad">${esc(errText(e))}</div></td></tr>`; return; }
    $('userCount').textContent = lastList.length;
    let h = `<tr><th>#</th><th>${t('fullName')}</th><th>${t('login')}</th><th>${t('role')}</th><th>${t('dataCol')}</th>
      <th>${t('lastLogin')}</th><th>${t('status')}</th><th></th></tr>`;
    lastList.forEach((u, i) => {
      const self = u.id === me.id, st = u.summary, on = u.active !== false;
      const data = st ? `${st.teachers} ${t('statTeachers')} · ${st.classes} ${t('statClasses')} · ${st.schedules}/4 ${t('statSchedules')}` : `<span class="muted">${t('noData')}</span>`;
      h += `<tr class="${on ? '' : 'muted'}"><td>${i + 1}</td>
        <td><span class="avatar sm">${esc(initials(u.name))}</span> <b>${esc(u.name)}</b>${self ? ` <small class="muted">(${t('you')})</small>` : ''}</td>
        <td><code>${esc(u.login)}</code></td>
        <td><select class="role-sel" data-role="${u.id}" ${self ? 'disabled' : ''}>${roleOpts(u.role)}</select></td>
        <td class="nowrap">${data}</td>
        <td class="nowrap">${fmtDate(u.lastLogin)}</td>
        <td><span class="pill ${on ? 'ok' : 'bad'}">${t(on ? 'active' : 'blocked')}</span></td>
        <td class="nowrap">
          <button class="btn sm" data-act="view" data-id="${u.id}">📂 ${t('openData')}</button>
          ${self ? '' : `<button class="btn sm" data-act="pwd" data-id="${u.id}">🔑 ${t('resetPwd')}</button>
          <button class="btn sm" data-act="toggle" data-id="${u.id}">${t(on ? 'block' : 'unblock')}</button>
          <button class="btn sm danger" data-act="del" data-id="${u.id}">${t('del')}</button>`}
        </td></tr>`;
    });
    $('userTable').innerHTML = h;
  }

  $('userTable').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b || !me || me.role !== 'admin') return;
    const u = lastList.find(x => x.id === b.dataset.id);
    if (!u) return;
    const act = b.dataset.act;
    if (act === 'view') return switchData(u.id);
    if (u.id === me.id) return;
    busy(b, async () => {
      try {
        if (act === 'pwd') {
          if (B.canSetPassword) return openPwd(u, false);
          const sentTo = await B.resetPassword(u);
          toast(t('resetSent') + ': ' + sentTo);
        } else if (act === 'toggle') {
          if (u.active !== false && u.role === 'admin' && activeAdmins(lastList).length <= 1) return toast(t('lastAdmin'), true);
          await B.updateUser(u.id, { active: u.active === false });
          await renderUsers();
        } else if (act === 'del') {
          if (!confirm(t('confirmDelUser') + '\n\n' + u.name + ' (' + u.login + ')')) return;
          await B.deleteUser(u.id);
          if (viewUser && viewUser.id === u.id) { ss.del(VIEW); location.reload(); return; }
          await renderUsers(); toast(t('saved'));
        }
      } catch (ex) {
        if (ex.code === 'resetUnsupported') alert(t('resetUnsupported'));
        else toast(errText(ex), true);
      }
    });
  });
  $('userTable').addEventListener('change', async e => {
    const s = e.target.closest('select[data-role]');
    if (!s) return;
    const u = lastList.find(x => x.id === s.dataset.role);
    if (!me || !u || u.id === me.id) return renderUsers();
    if (u.role === 'admin' && s.value !== 'admin' && activeAdmins(lastList).length <= 1) { toast(t('lastAdmin'), true); return renderUsers(); }
    try { await B.updateUser(u.id, { role: s.value }); toast(t('saved')); } catch (ex) { toast(errText(ex), true); }
    renderUsers();
  });

  $('btnGenPwd').addEventListener('click', () => { $('uPass').value = randomPassword(); });
  $('btnAddUser').addEventListener('click', () => {
    const d = { name: $('uName').value.trim(), login: $('uLogin').value.trim(), password: $('uPass').value, role: $('uRole').value };
    if (!d.name) return toast(t('errName'), true);
    if (!validLogin(d.login)) return toast(t('errLogin'), true);
    if (d.password.length < 6) return toast(t('errPass'), true);
    busy($('btnAddUser'), async () => {
      try {
        await B.createUser(d);
        toast(t('userAdded') + ': ' + d.login + ' / ' + d.password);
        $('uName').value = ''; $('uLogin').value = ''; $('uPass').value = '';
        await renderUsers();
      } catch (ex) { toast(errText(ex), true); }
    });
  });

  function onLang() {
    if (!$('authScreen').hidden) paintAuth();
    paintChrome();
    if ($('syncStatus').className) setSync($('syncStatus').className.replace('sync ', '') || 'local');
  }

  g.Auth = {
    get mode() { return B.mode; },
    current: () => me, dataId, renderUsers, onLang, logout,
    initialState: () => initialJson, persist, flush, _sha256: sha256
  };

  // ---------- Бастау ----------
  (async function boot() {
    showAuthScreen();
    setBoot(t('loading'));
    try { me = await B.init(); }
    catch (e) { setBoot(errText(e), true); return; }
    if (me) await enter(); else await showLogin();
  })();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
